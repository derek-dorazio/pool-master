# Development docker-compose — local databases and mock services
# Usage: docker compose -f infrastructure/docker/docker-compose.dev.yml up

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: poolmaster
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Email capture — all outbound SMTP lands here, viewable at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # AWS mock — SES, SNS, SQS on a single gateway endpoint
  localstack:
    image: localstack/localstack:latest
    environment:
      SERVICES: ses,sns,sqs
      DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./localstack-init:/etc/localstack/init

volumes:
  pgdata:
  localstack-data:
