openapi: 3.1.0
info:
  title: BALLDONTLIE - WNBA API
  version: 1.0.0
  description: WNBA endpoints for the BallDontLie API.
servers:
  - url: https://api.balldontlie.io
    description: Production server
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
  schemas:
    OddsLink:
      type: object
      additionalProperties: false
      required: [url, url_template]
      description: Exactly one of url and url_template is non-null. Templates may contain {state}, {pickType}, or {wagerAmount}; the consuming application supplies these values before navigation.
      properties:
        url:
          type: [string, "null"]
          description: A complete HTTPS sportsbook URL.
        url_template:
          type: [string, "null"]
          description: An HTTPS sportsbook URL requiring placeholder substitution. Use the sportsbook state code for {state}; BetRivers coupon links also require its pick type and wager amount.
      oneOf:
        - properties:
            url: {type: string}
            url_template: {type: "null"}
        - properties:
            url: {type: "null"}
            url_template: {type: string}
    OddsDeeplinks:
      type: [object, "null"]
      additionalProperties: false
      required: [event, selections]
      description: Available event and selection links, or null when unavailable. Coverage varies by sportsbook, event, and selection. Opening links do not preserve the historical price.
      properties:
        event:
          oneOf:
            - $ref: "#/components/schemas/OddsLink"
            - type: "null"
        selections:
          type: object
          description: Available links keyed by the corresponding selection. Missing links are omitted.
          additionalProperties:
            $ref: "#/components/schemas/OddsLink"
      example:
        event:
          url: null
          url_template: https://{state}.betrivers.com/?page=sportsbook#event/1028589932
        selections: {}
    CompetitionStatusState:
      type: string
      description: Normalized lifecycle state for cross-sport integrations. Classification may use the sport-specific lifecycle field and other available lifecycle context. `unknown` means the available lifecycle data cannot be safely classified.
      enum:
        - scheduled
        - in_progress
        - final
        - postponed
        - canceled
        - delayed
        - suspended
        - abandoned
        - unknown
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
    Pagination:
      type: object
      properties:
        next_cursor:
          type: integer
          description: Cursor for the next page of results
        prev_cursor:
          type: integer
          nullable: true
          description: Cursor for the previous page of results
        per_page:
          type: integer
          description: Number of results per page
    PlayerPropMeta:
      type: object
      description: Metadata for player prop responses (no pagination - all results returned in single response)
      properties:
        per_page:
          type: integer
          description: Total number of results returned
    WNBABettingOdd:
      type: object
