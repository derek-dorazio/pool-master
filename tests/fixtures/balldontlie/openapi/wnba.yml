  /wnba/v1/odds/player_props:
    get:
      summary: Get WNBA player prop betting odds
      description: |
        Retrieve live player prop betting data for WNBA games. Player prop data is LIVE and updated in real-time.
        We do not store historical data. As games near completion, many (or all) player props may be removed from sportsbooks.

        **Note:** This endpoint returns all player props for the specified game in a single response. Pagination is not supported.

        The API supports two market types:
        - **over_under**: Traditional over/under markets where users can bet on whether a player will go over or under a specific line value
        - **milestone**: Milestone markets where users bet on whether a player will reach a specific achievement
      tags:
        - WNBA
      parameters:
        - name: game_id
          in: query
          required: true
          schema:
            type: integer
          description: The game ID to retrieve player props for (required)
        - name: player_id
          in: query
          required: false
          schema:
            type: integer
          description: Filter props for a specific player
        - name: prop_type
          in: query
          required: false
          schema:
            type: string
          description: Filter by prop type
        - name: vendors
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Filter by specific sportsbook vendors. If not provided, returns props from all available vendors.
      responses:
        "200":
          description: WNBA player prop betting odds
          content:
            application/json:
              example:
                data:
                  - id: 7995669080
                    game_id: 24752
                    player_id: 465
                    vendor: betrivers
                    deeplinks:
                      event:
                        url: https://pa.betrivers.com/?page=sportsbook#event/1028589932
                        url_template: null
                      selections:
                        over:
                          url: null
                          url_template: >-
                            https://{state}.betrivers.com/?page=sportsbook#event/1028589932?coupon={pickType}|4365195318|{wagerAmount}
                        under:
                          url: null
                          url_template: >-
                            https://{state}.betrivers.com/?page=sportsbook#event/1028589932?coupon={pickType}|4365195319|{wagerAmount}
                    prop_type: assists
                    line_value: '2.5'
                    market:
                      type: over_under
                      over_odds: -174
                      under_odds: 130
                    updated_at: '2026-05-08T17:04:06.099Z'
                meta:
                  per_page: 26
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WNBAPlayerProp"
                  meta:
                    $ref: "#/components/schemas/PlayerPropMeta"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
