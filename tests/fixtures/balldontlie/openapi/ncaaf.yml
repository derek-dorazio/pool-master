  /ncaaf/v1/odds/player_props:
    get:
      summary: Get current NCAAF player prop odds
      description: |
        Retrieve current pre-game and live player prop betting odds. Sportsbook availability varies by game and market, and markets may be removed as a game progresses. The response is not paginated. Requires GOAT tier.

        Supported prop types are `passing_yards`, `passing_tds`, `rushing_yards`, `receiving_yards`, and `anytime_td`. Retained opening prices are available separately from the opening player-props endpoint.
      tags:
        - NCAAF
      parameters:
        - name: game_id
          in: query
          required: true
          schema:
            type: integer
          description: The game ID to retrieve current player props for
        - name: player_id
          in: query
          required: false
          schema:
            type: integer
          description: Filter props for a specific player
        - name: prop_type
          in: query
          required: false
          schema:
            type: string
            enum: [passing_yards, passing_tds, rushing_yards, receiving_yards, anytime_td]
          description: Filter by prop type
        - name: vendors
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Filter by sportsbook vendors
      responses:
        "200":
          description: Current NCAAF player prop odds
          content:
            application/json:
              example:
                data:
                  - id: 9094852831
                    game_id: 457158
                    player_id: 55829
                    vendor: betrivers
                    deeplinks:
                      event:
                        url: https://pa.betrivers.com/?page=sportsbook#event/1028589932
                        url_template: null
                      selections:
                        'yes':
                          url: null
                          url_template: >-
                            https://{state}.betrivers.com/?page=sportsbook#event/1028589932?coupon={pickType}|4365195318|{wagerAmount}
                    prop_type: passing_yards
                    line_value: '223.5'
                    market:
                      type: milestone
                      odds: -121
                    updated_at: '2026-08-25T01:29:42.087Z'
                meta:
                  per_page: 1
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NCAAFPlayerProp"
                  meta:
                    $ref: "#/components/schemas/PlayerPropMeta"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/ServerError"

