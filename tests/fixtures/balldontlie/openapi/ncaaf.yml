    OddsLink:
      type: object
      additionalProperties: false
      required: [url, url_template]
      description: Exactly one of url and url_template is non-null. Templates may contain {state}, {pickType}, or {wagerAmount}; the consuming application supplies these values before navigation.
      properties:
        url:
          type: [string, "null"]
          description: A complete HTTPS sportsbook URL.
        url_template:
          type: [string, "null"]
          description: An HTTPS sportsbook URL requiring placeholder substitution. Use the sportsbook state code for {state}; BetRivers coupon links also require its pick type and wager amount.
      oneOf:
        - properties:
            url: {type: string}
            url_template: {type: "null"}
        - properties:
            url: {type: "null"}
            url_template: {type: string}
    OddsDeeplinks:
      type: [object, "null"]
      additionalProperties: false
      required: [event, selections]
      description: Available event and selection links, or null when unavailable. Coverage varies by sportsbook, event, and selection. Opening links do not preserve the historical price.
      properties:
        event:
          oneOf:
            - $ref: "#/components/schemas/OddsLink"
            - type: "null"
        selections:
          type: object
          description: Available links keyed by the corresponding selection. Missing links are omitted.
          additionalProperties:
            $ref: "#/components/schemas/OddsLink"
      example:
        event:
          url: null
          url_template: https://{state}.betrivers.com/?page=sportsbook#event/1028589932
        selections: {}
    CompetitionStatusState:
      type: string
      description: Normalized lifecycle state for cross-sport integrations. Classification may use the sport-specific lifecycle field and other available lifecycle context. `unknown` means the available lifecycle data cannot be safely classified.
      enum:
        - scheduled
        - in_progress
        - final
        - postponed
        - canceled
        - delayed
        - suspended
        - abandoned
        - unknown
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
    NCAAFBettingOdd:
      type: object
      required: [deeplinks]
      properties:
        deeplinks:
          $ref: "#/components/schemas/OddsDeeplinks"
          description: "Available sportsbook links. Selection keys: moneyline_home, moneyline_away, spread_home, spread_away, total_over, total_under; only keys corresponding to returned prices and available links are included. Supported books: DraftKings, FanDuel, BetMGM, BetRivers, and Caesars."
        id:
          type: integer
          description: Betting odd ID
        game_id:
          type: integer
          description: Game ID
        vendor:
          type: string
          description: Sportsbook vendor name
        spread_home_value:
          type: string
          nullable: true
          description: Home team spread value
        spread_home_odds:
          type: integer
          nullable: true
          description: Home team spread odds
        spread_away_value:
          type: string
          nullable: true
          description: Away team spread value
        spread_away_odds:
          type: integer
          nullable: true
          description: Away team spread odds
        moneyline_home_odds:
          type: integer
          nullable: true
          description: Home team moneyline odds
        moneyline_away_odds:
          type: integer
          nullable: true
          description: Away team moneyline odds
        total_value:
          type: string
          nullable: true
          description: Total points line value
        total_over_odds:
