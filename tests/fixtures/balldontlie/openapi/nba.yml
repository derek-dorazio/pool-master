        rebound_chances_def:
          type: number
          nullable: true
          description: "Number of defensive rebound chances for this player: occasions when the player is nearest to the ball at some point after it passes below the rim and before the rebound is secured, while on defense. Available only for full-game records (period=0); null means unavailable, while zero means no recorded chances. These individual-player counts are separate from contested rebounds and deferred rebound chances. When all three counts are available, offensive plus defensive chances should equal total chances; flag inconsistent records rather than replacing returned counts with calculated values."
        rebound_chances_off:
          type: number
          nullable: true
          description: "Number of offensive rebound chances for this player: occasions when the player is nearest to the ball at some point after it passes below the rim and before the rebound is secured, while on offense. Available only for full-game records (period=0); null means unavailable, while zero means no recorded chances. These individual-player counts are separate from contested rebounds and deferred rebound chances. When all three counts are available, offensive plus defensive chances should equal total chances; flag inconsistent records rather than replacing returned counts with calculated values."
        rebound_chances_total:
          type: number
          nullable: true
          description: "Total rebound chances for this player across offense and defense. Available only for full-game records (period=0); null means unavailable, while zero means no recorded chances. These individual-player counts are separate from contested rebounds and deferred rebound chances. When all three counts are available, offensive plus defensive chances should equal total chances; flag inconsistent records rather than replacing returned counts with calculated values."
