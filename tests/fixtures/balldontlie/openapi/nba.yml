  /nba/v1/win_probabilities:
    get:
      summary: Get NBA win probabilities
      description: >-
        Get a completed game’s win-probability timeline in one response. Points are chronological;
        points with `play: null` appear last. Requires GOAT or ALL-ACCESS. Available from 2018–19;
        coverage varies. Data typically becomes available a few hours to a day after game
        completion. No live data.
      tags:
        - NBA
      parameters:
        - name: game_id
          in: query
          required: true
          description: Game ID. Returns all available points without pagination.
          schema:
            type: integer
      responses:
        "200":
          description: Available win probabilities.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NBAGameWinProbability"
              examples:
