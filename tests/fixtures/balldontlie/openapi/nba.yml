security:
  - ApiKeyAuth: []
paths:
  /nba/v1/shot_charts:
    get:
      summary: Get NBA shot charts
      description: >-
        Returns one row per field-goal attempt after a game finishes. Requires NBA GOAT or ALL-ACCESS.
        Preseason is excluded. Provide game_ids[], or seasons[] with player_ids[] or team_ids[].
        Different filters intersect; values within arrays match any. Results are ordered by shot ID.
        Coordinates and distance use feet, with the basket at (25, 0). Distance, coordinates, and
        zones may be null.
      tags:
        - NBA
      parameters:
        - name: game_ids[]
          in: query
          description: Game IDs.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
              minimum: 1
              maximum: 2147483647
        - name: seasons[]
          in: query
          description: Season start years; 2026 means 2026–27.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
              minimum: 1
              maximum: 2147483647
        - name: player_ids[]
          in: query
          description: Player IDs.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
              minimum: 1
              maximum: 2147483647
        - name: team_ids[]
          in: query
          description: Team IDs.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
              minimum: 1
              maximum: 2147483647
        - name: season_type
          in: query
          description: Season type.
          schema:
            type: string
            enum:
              - regular
              - playoffs
              - playin
              - ist
        - name: period
          in: query
          description: Period; overtime starts at 5.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: made
          in: query
          description: true for made shots or false for missed shots.
          schema:
            type: boolean
        - name: shot_value
          in: query
          description: Shot value.
          schema:
            type: integer
            enum:
              - 2
              - 3
        - name: cursor
          in: query
          description: Use next_cursor from the previous response.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: per_page
          in: query
          description: Results per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Shot attempts with cursor pagination. No matches return an empty data array.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NBAShotChart'
                  meta:
                    $ref: '#/components/schemas/Pagination'
              example:
                data:
                  - id: 10403170
                    game_id: 21717855
                    player_id: 101
                    team_id: 9
                    season: 2026
                    season_type: regular
                    period: 1
                    clock: '11:32'
                    made: false
                    shot_value: 3
                    shot_type: Jump Shot
                    shot_distance: 24
                    coordinate_x: 49.6
                    coordinate_y: 1.5
                    shot_zone_basic: Right Corner 3
                    shot_zone_area: Right Side(R)
                    shot_zone_range: 24+ ft.
                meta:
                  next_cursor: 10403170
                  per_page: 1
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/ServerError'
  /nba/v1/teams:
    get:
      summary: Get NBA teams
      tags:
        - NBA
      parameters:
        - name: division
          in: query
          required: false
          schema:
            type: string
          description: Filter by division
        - name: conference
          in: query
          required: false
          schema:
            type: string
          description: Filter by conference
      responses:
        "200":
          description: List of NBA teams
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NBATeam"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/ServerError"
  /nba/v1/teams/{id}:
    get:
      summary: Get specific NBA team
      tags:
        - NBA
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Team ID
      responses:
        "200":
          description: Team details
