        - $ref: "#/components/parameters/PerPageParam"
        - $ref: "#/components/parameters/TeamIdsParam"
        - $ref: "#/components/parameters/PlayerIdsParam"
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search by player name
        - name: first_name
          in: query
          required: false
          schema:
            type: string
          description: Filter by first name
        - name: last_name
          in: query
          required: false
          schema:
            type: string
          description: Filter by last name
      responses:
        "200":
          description: List of NBA players
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NBAPlayer"
                  meta:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/ServerError"
  /nba/v1/players/{id}:
    get:
      summary: Get specific NBA player
      tags:
        - NBA
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Player ID
      responses:
        "200":
          description: Player details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/NBAPlayer"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/ServerError"
  /nba/v1/games:
    get:
      summary: Get NBA games
      tags:
        - NBA
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/PerPageParam"
        - $ref: "#/components/parameters/DatesParam"
        - $ref: "#/components/parameters/TeamIdsParam"
        - name: seasons[]
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
          description: Filter by seasons
        - name: season_type
          in: query
          required: false
          schema:
            type: string
            enum: [preseason, regular, ist, playin, playoffs]
          description: Filter by season type. When omitted, all non-preseason game types are returned.
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter games after this date
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter games before this date
      responses:
        "200":
          description: List of NBA games
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NBAGame"
                  meta:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/ServerError"
  /nba/v1/games/{id}:
    get:
      summary: Get specific NBA game
      tags:
        - NBA
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Game ID
      responses:
        "200":
          description: Game details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/NBAGame"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/ServerError"
  /nba/v1/stats:
    get:
      summary: Get NBA stats
      description: |
        Successful responses include meta, including on empty pages. When fewer than per_page records are returned, meta.next_cursor is omitted, not null. A full page can return a cursor even if the next page is empty. Pass this endpoint’s returned next_cursor as cursor, keeping the same filters, until next_cursor is absent; do not use page numbers or cursors from another endpoint.
        Player stats do not include participation-status classifications such as DNP, inactive, or did not dress, or a filter for those statuses. Zero minutes or zero statistics do not identify a participation reason. Missing stats do not establish that a player did not participate.
      tags:
        - NBA
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/PerPageParam"
        - $ref: "#/components/parameters/PlayerIdsParam"
        - name: game_ids[]
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
          description: Filter by game IDs
        - $ref: "#/components/parameters/DatesParam"
        - name: seasons[]
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
          description: Filter by seasons
        - name: season_type
          in: query
          required: false
          schema:
            type: string
            enum: [preseason, regular, ist, playin, playoffs]
          description: Filter by season type. When omitted, all non-preseason game types are returned unless game_ids[] is supplied.
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter stats after this date
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter stats before this date
        - name: period
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Filter by period (quarter). Defaults to 0, which returns full game totals only.
      responses:
        "200":
          description: List of NBA stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NBAStats"
                  meta:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/ServerError"
  /nba/v1/season_averages:
    get:
      summary: Get NBA season averages
      tags:
        - NBA
      parameters:
        - name: season
          in: query
          required: true
          schema:
            type: integer
          description: Season year
        - name: player_id
          in: query
          required: true
          schema:
            type: integer
          description: Player ID
      responses:
        "200":
          description: Season averages
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NBASeasonAverages"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/ServerError"
  /nba/v1/season_averages/{type}:
    get:
      summary: Get NBA season averages by type
      tags:
        - NBA
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum:
              - general
              - clutch
              - defense
              - shooting
          description: Season average type
        - name: player_ids
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
          description: Filter by player IDs
        - name: season
          in: query
          required: true
          schema:
            type: integer
          description: Season year
        - name: season_type
          in: query
          required: true
          schema:
            type: string
            enum:
              - regular
              - playoffs
              - ist
              - playin
          description: Season type
        - name: type
          in: query
          required: true
          schema:
            type: string
          description: Statistics type
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: Season averages by type
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NBASeasonAverageV2"
                  meta:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/ServerError"
  /nba/v1/team_season_averages/{category}:
    get:
      summary: Get NBA team season averages by category
      description: |
        Retrieve team season averages for various statistical categories. Each category requires a specific type parameter
        that determines the exact stats returned. The hustle category does not require a type parameter.

        **Available category/type combinations:**
        - general: base, advanced, scoring, misc, opponent, defense, violations
        - clutch: base, advanced, misc, scoring
        - shooting: by_zone_base, by_zone_opponent, 5ft_range_base, 5ft_range_opponent
        - playtype: cut, handoff, isolation, offrebound, offscreen, postup, prballhandler, prrollman, spotup, transition, misc
        - tracking: painttouch, efficiency, speeddistance, defense, elbowtouch, posttouch, passing, drives, rebounding, catchshoot, pullupshot, possessions
        - hustle: (no type parameter required)
        - shotdashboard: overall, pullups, catch_and_shoot, less_than_10_ft
      tags:
        - NBA
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
            enum:
              - general
              - clutch
              - shooting
              - playtype
              - tracking
              - hustle
              - shotdashboard
          description: Statistical category
        - name: team_ids
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
          description: Filter by team IDs
        - name: season
          in: query
          required: true
          schema:
            type: integer
          description: Season year
        - name: season_type
          in: query
          required: true
          schema:
            type: string
            enum:
              - regular
              - playoffs
              - ist
          description: Season type
        - name: type
          in: query
          required: false
          schema:
            type: string
