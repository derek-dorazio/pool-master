                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NBAGameTracking"
                  meta:
                    $ref: "#/components/schemas/Pagination"
              examples:
                tracking:
                  summary: November 6, 2026
                  value:
                    data:
                      - id: 3095
                        game_id: 21718043
                        player_id: 38017677
                        team_id: 1
                        type: passing
                        stats:
                          min: 34.5
                          passes_made: 65
                          passes_received: 49
