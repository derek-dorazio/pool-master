      description: |
        Returns DraftKings and FanDuel daily fantasy lineup pools. A slate identifies
        its format, event window, salary cap, and whether it covers one or multiple games.
        Use the slate detail endpoint for included events and roster slots, then request
        draftables for selectable players or teams and their slate-specific salaries.
        Requires GOAT tier. Current slates are returned by default; use active=false for
        inactive historical snapshots.
