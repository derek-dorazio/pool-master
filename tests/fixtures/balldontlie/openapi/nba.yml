  /nba/v1/matchups:
    get:
      summary: Get NBA matchups
      description: >-
        Get an offensive player’s stats against an individual defender for a game. Requires GOAT or
        ALL-ACCESS. Available from 2018–19; coverage varies. Data typically becomes available a few
        hours to a day after game completion. No live data.
      tags:
        - NBA
      parameters:
        - name: game_ids[]
          in: query
          required: false
          description: Filter by game IDs.
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: dates[]
          in: query
          required: false
          description: Game dates in `YYYY-MM-DD` format.
          schema:
            type: array
            items:
              type: string
              format: date
          style: form
          explode: true
        - name: seasons[]
          in: query
          required: false
          description: "Season start years: `2018` means 2018–19."
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: start_date
          in: query
          required: false
          description: Include games on or after this date (`YYYY-MM-DD`).
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: false
          description: Include games on or before this date (`YYYY-MM-DD`).
          schema:
            type: string
            format: date
        - name: season_type
          in: query
          required: false
          description: "`regular`, `playoffs`, `playin`, `ist`, or `preseason`. Omit to exclude preseason."
          schema:
            type: string
            enum:
              - regular
              - playoffs
              - playin
              - ist
              - preseason
        - name: team_ids[]
          in: query
          required: false
          description: Filter by offensive team IDs.
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: cursor
          in: query
          required: false
          description: Use `meta.next_cursor` to request the next page.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: per_page
          in: query
          required: false
          description: Results per page. Default 25; maximum 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: player_ids[]
          in: query
          required: false
          description: Offensive player IDs.
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: opponent_player_ids[]
          in: query
          required: false
          description: Defender IDs.
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
      responses:
        "200":
          description: Available matchups.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NBAGameMatchup"
                  meta:
                    $ref: "#/components/schemas/Pagination"
              examples:
                matchups:
                  summary: November 6, 2026
