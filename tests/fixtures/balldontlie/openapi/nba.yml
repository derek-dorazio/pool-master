  /nba/v1/stats/tracking:
    get:
      summary: Get NBA game tracking stats
      description: >-
        Get per-game player tracking stats, including potential assists with `type=passing`.
        Full-game data only; quarter splits are unavailable. Requires GOAT or ALL-ACCESS. Available
        from 2018–19; coverage varies. Data typically becomes available a few hours to a day after
        game completion. No live data.
      tags:
        - NBA
      parameters:
        - name: game_ids[]
          in: query
          required: false
          description: Filter by game IDs.
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: dates[]
          in: query
          required: false
          description: Game dates in `YYYY-MM-DD` format.
          schema:
            type: array
            items:
              type: string
              format: date
          style: form
          explode: true
        - name: seasons[]
          in: query
          required: false
          description: "Season start years: `2018` means 2018–19."
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: start_date
          in: query
          required: false
          description: Include games on or after this date (`YYYY-MM-DD`).
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: false
          description: Include games on or before this date (`YYYY-MM-DD`).
          schema:
            type: string
            format: date
        - name: season_type
          in: query
          required: false
          description: "`regular`, `playoffs`, `playin`, `ist`, or `preseason`. Omit to exclude preseason."
          schema:
            type: string
            enum:
              - regular
              - playoffs
              - playin
              - ist
              - preseason
        - name: team_ids[]
          in: query
          required: false
          description: Filter by team IDs.
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: cursor
          in: query
          required: false
          description: Use `meta.next_cursor` to request the next page.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: per_page
          in: query
          required: false
          description: Results per page. Default 25; maximum 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: type
          in: query
          required: true
          description: Required statistics category.
          schema:
            type: string
            enum:
              - passing
              - drives
              - possessions
              - rebounding
              - speeddistance
              - elbowtouch
              - posttouch
              - painttouch
              - catchshoot
              - pullupshot
        - name: player_ids[]
          in: query
          required: false
          description: Player IDs.
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
