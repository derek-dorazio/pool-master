# Vendored copy of BALLDONTLIE's published NBA OpenAPI document, unchanged below this header.
# Source: https://www.balldontlie.io/openapi/nba.yml, fetched 2026-11-12 (sha256 9c8e40b11a588cbec0b51095ec34ea94de729cb9644ff72fc932893527282d4b).
# The contract tests hold the adapter to it. Refresh it with `npm run balldontlie:contract-check -- --update-spec`.
openapi: 3.1.0
info:
  title: BALLDONTLIE - NBA API
  version: 1.0.0
  description: NBA endpoints for the BallDontLie API.
servers:
  - url: https://api.balldontlie.io
    description: Production server
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
  schemas:
    NBAShotChart:
      type: object
      required:
        - id
        - game_id
        - player_id
        - team_id
        - season
        - season_type
        - period
        - clock
        - made
        - shot_value
        - shot_type
        - shot_distance
        - coordinate_x
        - coordinate_y
        - shot_zone_basic
        - shot_zone_area
        - shot_zone_range
      properties:
        id:
          type: integer
          description: Shot ID.
        game_id:
          type: integer
          description: Game ID.
        player_id:
          type: integer
          description: Player ID.
        team_id:
          type: integer
          description: Team ID.
        season:
          type: integer
          description: Season start year; 2026 means 2026–27.
        season_type:
          type: string
          enum:
            - regular
            - playoffs
            - playin
            - ist
        period:
          type: integer
          minimum: 1
          description: Overtime starts at 5.
        clock:
          type: string
          description: Time remaining in the period, as M:SS.
        made:
          type: boolean
        shot_value:
          type: integer
          enum:
            - 2
            - 3
        shot_type:
          type: string
        shot_distance:
          type:
            - number
            - 'null'
          description: Distance from the basket in feet.
        coordinate_x:
          type:
            - number
            - 'null'
          description: Horizontal position in feet; the basket is at x = 25.
        coordinate_y:
          type:
            - number
            - 'null'
          description: Position along the court in feet; the basket is at y = 0.
        shot_zone_basic:
          type:
            - string
            - 'null'
        shot_zone_area:
          type:
            - string
            - 'null'
        shot_zone_range:
          type:
            - string
            - 'null'
    OddsLink:
      type: object
      additionalProperties: false
      required: [url, url_template]
      description: Exactly one of url and url_template is non-null. Templates may contain {state}, {pickType}, or {wagerAmount}; the consuming application supplies these values before navigation.
      properties:
        url:
          type: [string, "null"]
          description: A complete HTTPS sportsbook URL.
        url_template:
          type: [string, "null"]
          description: An HTTPS sportsbook URL requiring placeholder substitution. Use the sportsbook state code for {state}; BetRivers coupon links also require its pick type and wager amount.
      oneOf:
        - properties:
            url: {type: string}
            url_template: {type: "null"}
        - properties:
            url: {type: "null"}
            url_template: {type: string}
    OddsDeeplinks:
      type: [object, "null"]
      additionalProperties: false
      required: [event, selections]
      description: Available event and selection links, or null when unavailable. Coverage varies by sportsbook, event, and selection. Opening links do not preserve the historical price.
      properties:
        event:
          oneOf:
            - $ref: "#/components/schemas/OddsLink"
            - type: "null"
        selections:
          type: object
          description: Available links keyed by the corresponding selection. Missing links are omitted.
          additionalProperties:
            $ref: "#/components/schemas/OddsLink"
      example:
        event:
          url: null
          url_template: https://{state}.betrivers.com/?page=sportsbook#event/1028589932
        selections: {}
    CompetitionStatusState:
      type: string
      description: Normalized lifecycle state for cross-sport integrations. Classification may use the sport-specific lifecycle field and other available lifecycle context. `unknown` means the available lifecycle data cannot be safely classified.
      enum:
        - scheduled
        - in_progress
        - final
        - postponed
        - canceled
        - delayed
        - suspended
        - abandoned
        - unknown
    DfsSlate:
      type: object
      description: A DFS lineup pool with included games and roster slots. Supports DraftKings and FanDuel.
      required:
        - id
        - sport
        - provider
        - format
        - scope
        - style
        - salary_cap
        - event_count
        - starts_at
        - last_event_starts_at
        - status
        - allow_late_swap
        - active
        - updated_at
      properties:
        id:
          type: integer
          minimum: 1
        sport:
          type: string
        provider:
          type: string
        format:
          type: string
          enum: [salary_cap, tiers, snake_draft]
        scope:
          type: string
          enum: [single_event, multi_event]
        style:
          type: string
        salary_cap:
          type: integer
          minimum: 0
          nullable: true
        event_count:
          type: integer
          minimum: 1
        starts_at:
          type: string
          format: date-time
        last_event_starts_at:
          type: string
          format: date-time
        status:
          type: string
        allow_late_swap:
          type: boolean
          nullable: true
        active:
          type: boolean
        updated_at:
          type: string
          format: date-time
    DfsSlateEvent:
      type: object
      description: A real game included in a DFS slate.
      required:
        - id
        - game_id
        - name
        - starts_at
        - away_team_abbreviation
        - home_team_abbreviation
        - active
      properties:
        id:
          type: integer
          minimum: 1
        game_id:
          type: integer
          minimum: 1
          nullable: true
          description: BALLDONTLIE game ID when a reference is available.
        name:
          type: string
        starts_at:
          type: string
          format: date-time
        away_team_abbreviation:
          type: string
          nullable: true
        home_team_abbreviation:
          type: string
          nullable: true
        active:
          type: boolean
    DfsRosterSlot:
      type: object
      description: A lineup position required by a DFS slate.
      required:
        - id
        - name
        - description
        - instructions
        - required_count
        - display_order
        - active
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        description:
          type: string
          nullable: true
        instructions:
          type: string
          nullable: true
        required_count:
          type: integer
          minimum: 1
        display_order:
          type: integer
          minimum: 0
        active:
          type: boolean
    DfsSlateDetail:
      allOf:
        - $ref: "#/components/schemas/DfsSlate"
        - type: object
          required:
            - events
            - roster_slots
          properties:
            events:
              type: array
              items:
                $ref: "#/components/schemas/DfsSlateEvent"
            roster_slots:
              type: array
              items:
                $ref: "#/components/schemas/DfsRosterSlot"
    DfsDraftable:
      type: object
      description: A player or team that can be selected for a slate roster slot.
      required:
        - id
        - slate_id
        - slate_event_id
        - roster_slot_id
        - game_id
        - player_id
        - team_id
        - entity_type
        - first_name
        - last_name
        - display_name
        - short_name
        - position
        - salary
        - status
        - is_swappable
        - is_disabled
        - team_abbreviation
        - active
        - updated_at
      properties:
        id:
          type: integer
          minimum: 1
        slate_id:
          type: integer
          minimum: 1
        slate_event_id:
          type: integer
          minimum: 1
        roster_slot_id:
          type: integer
          minimum: 1
        game_id:
          type: integer
          minimum: 1
          nullable: true
          description: BALLDONTLIE game ID when a reference is available.
        player_id:
          type: integer
          minimum: 1
          nullable: true
          description: Player ID when available. Null for team entries and when a player relationship is unavailable.
        team_id:
          type: integer
          minimum: 1
          nullable: true
          description: BALLDONTLIE team ID when a reference is available.
        entity_type:
          type: string
          enum: [player, team]
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        display_name:
          type: string
        short_name:
          type: string
          nullable: true
        position:
          type: string
          nullable: true
        salary:
          type: integer
          minimum: 0
          nullable: true
        status:
          type: string
          nullable: true
        is_swappable:
          type: boolean
          nullable: true
        is_disabled:
          type: boolean
          nullable: true
        team_abbreviation:
          type: string
          nullable: true
        active:
          type: boolean
        updated_at:
          type: string
          format: date-time
    DfsPagination:
      type: object
      required:
        - per_page
      properties:
        prev_cursor:
          type: integer
          minimum: 1
          description: Present when the request supplied a cursor.
        next_cursor:
          type: integer
          minimum: 1
          description: Present when another page may be available.
        per_page:
          type: integer
          minimum: 1
          maximum: 100
    DfsSlateListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DfsSlate"
        meta:
          $ref: "#/components/schemas/DfsPagination"
    DfsSlateDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/DfsSlateDetail"
    DfsDraftableListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DfsDraftable"
        meta:
          $ref: "#/components/schemas/DfsPagination"
    DfsValidationError:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - param
              - error
            properties:
              param:
                type: string
              error:
                type: string
    DfsServerError:
      type: object
      required: [message]
      properties:
        message:
          type: string
          const: Internal Server Error
    Error:
