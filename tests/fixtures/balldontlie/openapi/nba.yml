  /nba/v1/projected_lineups:
    get:
      summary: Get NBA projected lineups
      description: |
        Requires the GOAT tier. Returns one record per game and team with five projected starters.
        Updates stop at scheduled start or earlier live status. The last pregame snapshot remains available afterward.
        Expected and confirmed describe the latest pregame information; reaching tip-off does not change the status to confirmed.
        Teams without a projection are omitted. No matches returns an empty data array.
        Filters combine, and multiple values within a filter match any listed value. Without filters, returns available projections across dates, ordered by lineup ID.
        Also available at /v1/projected_lineups. Actual starters and bench players are available through /nba/v1/lineups.
      tags: [NBA]
      parameters:
        - name: game_ids[]
          in: query
          required: false
          description: Filter by game IDs.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
              minimum: 1
              maximum: 2147483647
        - name: team_ids[]
          in: query
          required: false
          description: Return these teams' projections.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
              minimum: 1
              maximum: 2147483647
        - name: dates[]
          in: query
          required: false
          description: Filter by game dates, YYYY-MM-DD.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              format: date
        - name: seasons[]
          in: query
          required: false
          description: Filter by season start years, e.g. 2026 for 2026-27.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
              minimum: 1
              maximum: 2147483647
        - name: cursor
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Projected lineups
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NBAProjectedLineup"
                  meta:
                    $ref: "#/components/schemas/Pagination"
              example: {"data": [{"id": 1, "game_id": 21718012, "team_id": 6, "status": "expected", "lineup": [{"position": "PG", "player": {"id": 192, "first_name": "James", "last_name": "Harden"}}, {"position": "SG", "player": {"id": 322, "first_name": "Donovan", "last_name": "Mitchell"}}, {"position": "SF", "player": {"id": 38017721, "first_name": "Peyton", "last_name": "Watson"}}, {"position": "PF", "player": {"id": 17896076, "first_name": "Evan", "last_name": "Mobley"}}, {"position": "C", "player": {"id": 9, "first_name": "Jarrett", "last_name": "Allen"}}], "updated_at": "2026-11-02T18:26:13.837Z"}], "meta": {"per_page": 25}}
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/ServerError"
