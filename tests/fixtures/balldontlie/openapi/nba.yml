  /nba/v2/stats/advanced:
    get:
      summary: Get NBA advanced stats (V2)
      description: |
        Retrieve comprehensive advanced statistics for NBA player performances. This V2 endpoint includes
        additional metrics from tracking data, hustle stats, defensive matchups, and usage analytics.

        Omitting period returns available records across periods; use period=0 for full-game records only.
        Advanced stats do not expose total playing minutes or seconds. matchup_minutes measures time guarding a matchup, not total playing time.
        No participation-status classification is included, and missing rows do not establish non-participation.
        Successful responses include meta, including on empty pages. When fewer than per_page records are returned, meta.next_cursor is omitted, not null. A full page can return a cursor even if the next page is empty. Pass this endpoint’s returned next_cursor as cursor, keeping the same filters, until next_cursor is absent; do not use page numbers or cursors from another endpoint.

        Includes data from:
        - Box score advanced (PIE, ratings, efficiency metrics)
        - Box score misc (fast break points, second chance points)
        - Box score scoring (shot distribution percentages)
        - Four factors (effective FG%, turnover rate)
        - Hustle stats (deflections, contested shots, loose balls)
        - Defensive matchups (matchup FG%, points allowed)
        - Player tracking (speed, distance, touches)
        - Usage stats (percentage of team stats)
      tags:
        - NBA
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/PerPageParam"
        - $ref: "#/components/parameters/PlayerIdsParam"
        - name: game_ids[]
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
          description: Filter by game IDs
        - $ref: "#/components/parameters/DatesParam"
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Start date for filtering (YYYY-MM-DD)
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: End date for filtering (YYYY-MM-DD)
        - name: seasons[]
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
          description: Filter by seasons
        - name: period
          in: query
          required: false
          schema:
            type: integer
          description: Filter by game period (0 for full game stats). When omitted, returns available records across periods.
      responses:
        "200":
          description: NBA advanced stats V2
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NBAAdvancedStatsV2"
                  meta:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/ServerError"
