  - ApiKeyAuth: []
paths:
  /nhl/v1/projected_lineups:
    get:
      summary: Get projected NHL lineups
      description: >-
        Requires GOAT. Returns one projection per game and team. These are projections, not confirmed starters.
        Coverage varies by game; missing projections are omitted. Filters combine with AND. Results are ordered
        by ascending lineup ID.
      tags:
        - NHL
      parameters:
        - name: game_ids[]
          in: query
          required: false
          description: Filter by game IDs.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
        - name: team_ids[]
          in: query
          required: false
          description: Filter by the team whose lineup is returned.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
        - name: dates[]
          in: query
          required: false
          description: Filter by game dates (YYYY-MM-DD).
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              format: date
        - name: season
          in: query
          required: false
          description: Season start year, e.g. 2026 for 2026-27.
          schema:
            type: integer
            minimum: 1900
            maximum: 9998
        - name: cursor
          in: query
          required: false
          description: Cursor from the previous response; keep filters unchanged.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: per_page
          in: query
          required: false
          description: Results per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Projected lineups. Missing projections are omitted.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NHLProjectedLineup'
                  meta:
                    $ref: '#/components/schemas/Pagination'
