  /nhl/v1/team_period_stats:
    get:
      summary: Get Team Period Stats
      description: >-
        GOAT tier required; also available with ALL-ACCESS. Returns available regular-season and playoff period
        counts from the 2010 season onward. Historical coverage has gaps. Counts are nonnegative integers or
        null; zero means zero recorded events, and null means unavailable or inapplicable. Live and completed
        games can receive corrections. Shootouts are excluded; overtime periods retain 4, 5, 6, and so on. No
        implicit season filter. Filters combine with AND; values within an array combine with OR. Results are
        ordered by ascending row ID. Keep filters unchanged when following cursors. Pagination is not a change
        feed.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: 'game_ids[]'
          in: query
          required: false
          style: form
          explode: true
          description: Filter game IDs.
          schema:
            type: array
            items:
              type: integer
              minimum: 1
              maximum: 2147483647
        - name: 'team_ids[]'
          in: query
          required: false
          style: form
          explode: true
          description: Filter the row’s team.
          schema:
            type: array
            items:
              type: integer
              minimum: 1
              maximum: 2147483647
        - name: 'periods[]'
          in: query
          required: false
          style: form
          explode: true
          description: Filter period numbers.
          schema:
            type: array
            items:
              type: integer
              minimum: 1
              maximum: 2147483647
        - name: season
          in: query
          description: Four-digit starting year; 2026 means 2026–27.
          schema:
            type: integer
            minimum: 1000
            maximum: 9999
        - name: 'dates[]'
          in: query
          style: form
          explode: true
          description: 'Game dates, YYYY-MM-DD.'
          schema:
            type: array
            items:
              type: string
              format: date
        - name: period_type
          in: query
          schema:
            type: string
            enum:
              - REG
              - OT
        - name: postseason
          in: query
          description: 'true for playoffs, false for regular season; omitted includes both.'
          schema:
            type: boolean
        - name: cursor
          in: query
          description: ID from meta.next_cursor; omit for the first page.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: >-
            Period counts. Empty matches return an empty data array. A full final page may require one empty
            follow-up request.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NHLTeamPeriodStat'
                  meta:
                    $ref: '#/components/schemas/Pagination'
              example:
                data:
                  - id: 76927
                    game_id: 3328232
                    team:
                      id: 60
                      full_name: Vancouver Canucks
                      tricode: VAN
                      conference_name: Western
                      division_name: Pacific
                    period: 1
                    period_type: REG
                    goals: 0
                    assists: 0
                    shots_on_goal: 10
                    missed_shots: 6
                    blocked_shot_attempts: 6
                    hits: 10
                    blocked_shots: 3
                    giveaways: 6
                    takeaways: 4
                    penalty_minutes: 4
                    faceoffs_won: 10
                    faceoffs_lost: 6
                    updated_at: '2026-10-26T20:01:37.423Z'
                meta:
                  per_page: 2
        '400':
          description: Invalid query parameters.
        '401':
          description: 'Missing or invalid API key, or insufficient tier.'
        '429':
          description: Rate limit exceeded.
