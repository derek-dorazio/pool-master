<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The app bar's navy (--surface-inverse), so a phone's browser bar runs into the header. -->
    <meta name="theme-color" content="#0b1e3f" />
    <title>__PRODUCT_NAME__</title>
    <script>
      // Light or dark before the first paint (#1471): a signed-in member's remembered Appearance,
      // else the device. src/lib/color-scheme.ts takes over once the app loads; the key below is
      // its COLOR_SCHEME_STORAGE_KEY. A Content-Security-Policy, if one is ever added, must
      // allow this inline script by its sha256 hash.
      (function () {
        var choice = null;
        try {
          choice = window.localStorage.getItem('poolmaster.colorScheme');
        } catch (error) {
          choice = null;
        }
        var dark = choice === 'DARK' || (choice !== 'LIGHT' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
