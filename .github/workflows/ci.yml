name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-2

jobs:
  # #300 — which areas this change can affect, so jobs that cannot be affected are skipped.
  # Narrative and the reasoning behind every rule: plans/146-ci-path-filtered-jobs.md.
  #
  # This job ALWAYS runs, on pull requests and on pushes alike. It must, for two reasons: a job
  # that `needs:` a skipped job is itself skipped, so skipping this one would cascade into
  # skipping the suites and then the deploy; and the gating below reads its outputs.
  #
  # On anything that is not a pull request it reports every area as changed without looking, so a
  # push to main runs the full set. main's run is what gates deploy-publish-images, and filtering
  # there would mean deploying code whose tests never ran -- #281's failure through another door.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
      service: ${{ steps.classify.outputs.service }}
      client: ${{ steps.classify.outputs.client }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The merge base needs history on both sides; a shallow clone has neither.
          fetch-depth: 0
      - name: List the files this pull request changes
        if: github.event_name == 'pull_request'
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.base_ref }}"
          # Diff against the merge base, not the base tip: otherwise every commit landing on main
          # while the PR is open shows up as "changed by this PR".
          MERGE_BASE=$(git merge-base "$BASE" HEAD)
          echo "merge base: $MERGE_BASE"
          git diff --name-only "$MERGE_BASE" HEAD > changed-files.txt
          wc -l < changed-files.txt
      - name: Classify the changed areas
        id: classify
        run: node scripts/ci-changed-areas.mjs changed-files.txt

  # Repo-wide gates: the published contract and the model/rule guards. Scope is the
  # whole repository, so this blocks both service and web work.
  all-contract-gates:
    name: all-contract-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # #266 — the migration timestamp check compares against HEAD^1 (the base tip for a
          # PR's merge ref, the previous main for a push), so the job needs one parent.
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate --schema=packages/core-api/prisma/schema.prisma
      - run: npm run build --workspace @poolmaster/shared
      - name: all - rule enforcement checks
        run: npm run rules:check
      - name: all - generated API freshness
        run: npm run api:check
      - name: all - generated API spec quality
        run: npm run api:validate
      - name: all - deploy and migration script tests
        run: npm run test:scripts
      # #284 — advisory, not a gate: the script warns and exits 0 when the marker is missing.
      # It sits in this job only because this is where the PR context is already set up; it is
      # deliberately not one of the gates above, and must not grow into one. A presence check
      # cannot judge disclosure quality, and this job gates every downstream job.
      - name: all - review triggers marker (PRs only, advisory)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/check-pr-review-triggers.mjs

  # Service-tier static checks. Separate from the web equivalents so a client-side type
  # error cannot prevent the backend integration and functional suites from reporting —
  # see plans/145, phase 1, where the client is deliberately red while the service tier
  # is brought into line.
  service-lint-typecheck:
    name: service-lint-typecheck
    runs-on: ubuntu-latest
    needs: [all-contract-gates, changes]
    # #300 — see plans/146. A documentation-only change cannot break lint or typecheck.
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate --schema=packages/core-api/prisma/schema.prisma
      - run: npm run build --workspace @poolmaster/shared
      - name: service - lint
        run: npm run lint:service
      - name: service - typecheck
        run: npm run typecheck:service
      # turbo typecheck compiles packages/ only (#181), so tests/ was never
      # type-checked anywhere. Both CI fallouts on #197 were tests importing
      # modules the change had deleted.
      - name: service - typecheck tests
        run: npm run typecheck:tests

  # =========================================================================
  # Service test suites (#294)
  # =========================================================================
  # One job per suite, in parallel, each with its own database. They need only
  # all-contract-gates: lint and typecheck still block publish (deploy-publish-images
  # needs service-lint-typecheck), but no longer hold the tests back. Each job publishes
  # its own coverage; merging them is coverage-report's job and gates nothing.

  # No database. The coverage threshold in tests/jest.config.js is enforced here and is
  # the only coverage gate in CI.
  service-unit-tests:
    name: service-unit-tests
    runs-on: ubuntu-latest
    needs: [all-contract-gates, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.service == 'true'
    env:
      # Required at bootstrap with no fallback (#134, core/config.ts). The test
      # helpers set these too, but CI is explicit so a suite that bootstraps
      # outside a helper still starts.
      POOLMASTER_ENVIRONMENT: ci
      RELEASE_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate --schema=packages/core-api/prisma/schema.prisma

      - name: Run service unit tests with coverage
        run: npm run test:coverage:service:unit

      - name: Service unit coverage summary
        if: ${{ !cancelled() }}
        run: node scripts/write-coverage-summary.mjs "Service Unit Coverage" "Unit=coverage/service-unit/coverage-summary.json"

      - name: Upload service unit coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: coverage-service-unit
          path: |
            coverage/service-unit/coverage-final.json
            coverage/service-unit/coverage-summary.json
            coverage/service-unit/lcov.info
            coverage/service-unit/clover.xml
            coverage/service-unit/lcov-report/**
          if-no-files-found: warn

  service-integration-tests:
    name: service-integration-tests
    runs-on: ubuntu-latest
    needs: [all-contract-gates, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.service == 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: poolmaster
          POSTGRES_PASSWORD: poolmaster
          POSTGRES_DB: poolmaster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://poolmaster:poolmaster@localhost:5432/poolmaster_test
      # Required at bootstrap with no fallback (#134, core/config.ts). The test
      # helpers set these too, but CI is explicit so a suite that bootstraps
      # outside a helper still starts.
      POOLMASTER_ENVIRONMENT: ci
      RELEASE_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate --schema=packages/core-api/prisma/schema.prisma

      - name: Run Prisma migrations
        run: npx prisma migrate deploy --schema=packages/core-api/prisma/schema.prisma

      - name: Run service integration tests with coverage
        run: npm run test:coverage:service:integration

      - name: Service integration coverage summary
        if: ${{ !cancelled() }}
        run: node scripts/write-coverage-summary.mjs "Service Integration Coverage" "Integration=coverage/service-integration/coverage-summary.json"

      - name: Upload service integration coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: coverage-service-integration
          path: |
            coverage/service-integration/coverage-final.json
            coverage/service-integration/coverage-summary.json
            coverage/service-integration/lcov.info
            coverage/service-integration/clover.xml
            coverage/service-integration/lcov-report/**
          if-no-files-found: warn

  service-functional-api-tests:
    name: service-functional-api-tests
    runs-on: ubuntu-latest
    needs: [all-contract-gates, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.service == 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: poolmaster
          POSTGRES_PASSWORD: poolmaster
          POSTGRES_DB: poolmaster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://poolmaster:poolmaster@localhost:5432/poolmaster_test
      # Required at bootstrap with no fallback (#134, core/config.ts). The test
      # helpers set these too, but CI is explicit so a suite that bootstraps
      # outside a helper still starts.
      POOLMASTER_ENVIRONMENT: ci
      RELEASE_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate --schema=packages/core-api/prisma/schema.prisma

      - name: Run Prisma migrations
        run: npx prisma migrate deploy --schema=packages/core-api/prisma/schema.prisma

      - name: Run service functional API tests with coverage
        run: npm run test:coverage:service:functional-api

      - name: Service functional API coverage summary
        if: ${{ !cancelled() }}
        run: node scripts/write-coverage-summary.mjs "Service Functional API Coverage" "Functional API=coverage/service-functional-api/coverage-summary.json"

      - name: Upload service functional API coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: coverage-service-functional-api
          path: |
            coverage/service-functional-api/coverage-final.json
            coverage/service-functional-api/coverage-summary.json
            coverage/service-functional-api/lcov.info
            coverage/service-functional-api/clover.xml
            coverage/service-functional-api/lcov-report/**
          if-no-files-found: warn

  # =========================================================================
  # PoolMaster Webapp Unit Tests + Coverage (Vitest)
  # =========================================================================
  poolmaster-unit-tests:
    name: poolmaster-unit-tests
    runs-on: ubuntu-latest
    needs: [all-contract-gates, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.client == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace @poolmaster/shared

      - name: Run PoolMaster unit tests with coverage
        run: npm run test:coverage:poolmaster:unit

      - name: PoolMaster unit coverage summary
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'clients/poolmaster/coverage/coverage-summary.json';
          const summary = process.env.GITHUB_STEP_SUMMARY;

          if (!fs.existsSync(path)) {
            console.log('PoolMaster coverage data not available');
            fs.appendFileSync(summary, '### PoolMaster Unit Coverage\n\nCoverage data not available\n');
            process.exit(0);
          }

          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const t = data.total;
          const lines = [
            `Statements: ${t.statements.pct}%`,
            `Branches: ${t.branches.pct}%`,
            `Functions: ${t.functions.pct}%`,
            `Lines: ${t.lines.pct}%`,
          ];

          console.log('PoolMaster unit coverage totals');
          for (const line of lines) console.log(line);

          fs.appendFileSync(
            summary,
              [
              '### PoolMaster Unit Coverage',
              '',
              '| Metric | Coverage |',
              '|---|---:|',
              `| Statements | ${t.statements.pct}% |`,
              `| Branches | ${t.branches.pct}% |`,
              `| Functions | ${t.functions.pct}% |`,
              `| Lines | ${t.lines.pct}% |`,
              '',
            ].join('\n'),
          );
          NODE

      - name: Upload PoolMaster unit coverage artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-poolmaster-unit
          path: |
            clients/poolmaster/coverage/coverage-summary.json
            clients/poolmaster/coverage/lcov.info
            clients/poolmaster/coverage/clover.xml
            clients/poolmaster/coverage/coverage-final.json
          if-no-files-found: warn

  # Advisory (#294): merges the three service suites' coverage into one report and
  # tabulates it beside PoolMaster unit coverage. It runs no tests and nothing needs it, so
  # deploy-publish-images never waits on it; continue-on-error keeps a failed merge from
  # failing the run. Main pushes only — on PRs each suite job's own summary is the view.
  # !cancelled() rather than always(): a run superseded under cancel-in-progress should not
  # start a merge.
  coverage-report:
    name: coverage-report
    runs-on: ubuntu-latest
    needs: [service-unit-tests, service-integration-tests, service-functional-api-tests, poolmaster-unit-tests]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Download service unit coverage
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: coverage-service-unit
          path: coverage/service-unit

      - name: Download service integration coverage
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: coverage-service-integration
          path: coverage/service-integration

      - name: Download service functional API coverage
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: coverage-service-functional-api
          path: coverage/service-functional-api

      - name: Download PoolMaster unit coverage
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: coverage-poolmaster-unit
          path: coverage/poolmaster-unit

      # Warns (a run-page annotation) for each missing suite and merges the rest.
      - name: Merge service coverage
        run: node scripts/merge-service-coverage.mjs

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          node scripts/write-coverage-summary.mjs "Coverage Summary" \
            "Service (merged unit + integration + functional API)=coverage/service-merged/coverage-summary.json" \
            "PoolMaster Unit=coverage/poolmaster-unit/coverage-summary.json"

      - name: Upload merged service coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: coverage-service-report
          path: |
            coverage/service-merged/coverage-final.json
            coverage/service-merged/coverage-summary.json
            coverage/service-merged/lcov.info
            coverage/service-merged/clover.xml
            coverage/service-merged/lcov-report/**
          if-no-files-found: warn

  service-build:
    name: service-build
    runs-on: ubuntu-latest
    needs: service-lint-typecheck
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate --schema=packages/core-api/prisma/schema.prisma
      - run: npm run build:service

  service-mock-provider-build:
    name: service-mock-provider-build
    runs-on: ubuntu-latest
    needs: service-lint-typecheck
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --workspace @poolmaster/mock-contest-feed-provider
      - run: npm run typecheck --workspace @poolmaster/mock-contest-feed-provider
      - run: npm run build --workspace @poolmaster/mock-contest-feed-provider

  poolmaster-build:
    name: poolmaster-build
    runs-on: ubuntu-latest
    needs: [all-contract-gates, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate --schema=packages/core-api/prisma/schema.prisma
      - run: npm run build --workspace @poolmaster/shared
      # The webapp's own gates live here rather than in lint-and-typecheck, so that a
      # client-side failure does not skip the backend test jobs that depend on it.
      - name: poolmaster - lint
        run: npm run lint:webapp
      - name: poolmaster - typecheck
        run: npm run typecheck:webapp
      - run: npm run build:poolmaster

  # Browser e2e against a local stack (#278): the production build served by
  # `vite preview`, whose proxy routes /api to a core-api on a throwaway
  # Postgres. No deploy, no AWS, no secrets: the job seeds its own root admin
  # with a password generated for this run. Runs every spec, untagged ones too.
  poolmaster-browser-e2e-local:
    name: poolmaster-browser-e2e-local
    runs-on: ubuntu-latest
    needs: [all-contract-gates, changes]
    # #300 — see plans/146. Gated on `code`, not `client`: it runs the whole stack, core-api included.
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: poolmaster
          POSTGRES_PASSWORD: poolmaster
          POSTGRES_DB: poolmaster_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://poolmaster:poolmaster@localhost:5432/poolmaster_e2e
      # core/config.ts requires these three with no fallback (#134).
      POOLMASTER_ENVIRONMENT: ci
      POOLMASTER_SERVICE_VERSION: ${{ github.sha }}
      CORE_API_PORT: '3000'
      AUTO_START_SCHEDULER: 'false'
      POOLMASTER_E2E_BASE_URL: http://localhost:4175
      POOLMASTER_E2E_ADMIN_IDENTIFIER: e2e-ci-admin
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate --schema=packages/core-api/prisma/schema.prisma
      - name: Generate this run's JWT secret and admin password
        run: |
          JWT_SECRET=$(openssl rand -hex 32)
          ADMIN_PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$ADMIN_PASSWORD"
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          echo "POOLMASTER_E2E_ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"
      - name: Run Prisma migrations
        run: npx prisma migrate deploy --schema=packages/core-api/prisma/schema.prisma
      - name: Seed the run's root admin
        run: |
          FIXTURE_JSON=$(node -e 'console.log(JSON.stringify([{
            email: "e2e-ci-admin@e2e.invalid",
            username: process.env.POOLMASTER_E2E_ADMIN_IDENTIFIER,
            password: process.env.POOLMASTER_E2E_ADMIN_PASSWORD,
            firstName: "E2E",
            lastName: "Admin",
            isRootAdmin: true,
          }]))') node packages/core-api/scripts/bootstrap-users.mjs
      # Builds packages/shared before the client. core-api resolves shared
      # through its dist too, and a stale dist fails the API boot with an
      # unregistered-OpenAPI-component error that looks like a product bug.
      - name: Build shared and the production client bundle
        run: npm run build:poolmaster
      - name: Start core-api
        run: |
          cd packages/core-api
          nohup npx tsx src/index.ts > "$RUNNER_TEMP/core-api.log" 2>&1 &
          # /health is unauthenticated; /api/v1/health answers 401.
          for ATTEMPT in $(seq 1 30); do
            if curl -fs http://localhost:3000/health > /dev/null; then
              echo "core-api is up"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/core-api.log"
          exit 1
      - name: Serve the build with /api proxied to core-api
        run: |
          cd clients/poolmaster
          nohup npx vite preview > "$RUNNER_TEMP/preview.log" 2>&1 &
          for ATTEMPT in $(seq 1 30); do
            if curl -fs "$POOLMASTER_E2E_BASE_URL/" > /dev/null; then
              break
            fi
            sleep 1
          done
          # The static server answers any unknown path with index.html (200);
          # only core-api answers this with 401, so it proves the proxy.
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$POOLMASTER_E2E_BASE_URL/api/v1/health")
          if [ "$STATUS" != "401" ]; then
            echo "Expected 401 from core-api through the preview proxy, got $STATUS"
            cat "$RUNNER_TEMP/preview.log"
            exit 1
          fi
          echo "Build served at $POOLMASTER_E2E_BASE_URL with /api reaching core-api"
      - name: Install Playwright Chromium
        run: cd clients/poolmaster && npx playwright install --with-deps chromium
      - name: Run PoolMaster browser E2E against the local stack
        run: npm run test:poolmaster:browser-e2e
      - name: Collect server logs
        if: failure()
        run: cp "$RUNNER_TEMP/core-api.log" "$RUNNER_TEMP/preview.log" clients/poolmaster/ || true
      - name: Upload PoolMaster browser E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: poolmaster-browser-e2e-local
          path: |
            clients/poolmaster/playwright-report/**
            clients/poolmaster/test-results/**
            clients/poolmaster/core-api.log
            clients/poolmaster/preview.log
          if-no-files-found: warn
      - name: PoolMaster browser E2E (local stack) summary
        if: always()
        run: |
          echo "### PoolMaster Browser E2E (local stack)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Target: production build via \`vite preview\`, \`/api\` proxied to core-api on a throwaway Postgres" >> $GITHUB_STEP_SUMMARY
          echo "- Specs: all (ping, smoke, plumbing probe) — #278" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # QA deploy: publish images -> migrate -> roll out -> browser e2e.
  # Migrations gate the rollout (#191): publish only builds images and
  # registers task definitions; nothing reaches QA until deploy-migrate-qa
  # has succeeded, so a failed migration leaves the previous release running.
  # =========================================================================
  deploy-publish-images:
    name: deploy-publish-images
    runs-on: ubuntu-latest
    # The three service suite jobs, not coverage-report: the merged report gates nothing (#294).
    # service-lint-typecheck is also reached through service-build; it is listed so the lint
    # gate stays visible now that the test jobs no longer wait on it.
    needs: [service-unit-tests, service-integration-tests, service-functional-api-tests, service-lint-typecheck, poolmaster-unit-tests, service-build, service-mock-provider-build, poolmaster-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      qa_core_api_task_definition: ${{ steps.register-qa-task-defs.outputs.qa_core_api_task_definition }}
      qa_migrate_task_definition: ${{ steps.register-qa-task-defs.outputs.qa_migrate_task_definition }}
      qa_mock_contest_feed_provider_task_definition: ${{ steps.register-qa-task-defs.outputs.qa_mock_contest_feed_provider_task_definition }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image tags
        id: tags
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          FULL_SHA="${{ github.sha }}"
          PREFIX="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/poolmaster-qa"
          echo "sha_tag=${SHA}" >> $GITHUB_OUTPUT
          echo "full_sha=${FULL_SHA}" >> $GITHUB_OUTPUT
          echo "prefix=${PREFIX}" >> $GITHUB_OUTPUT

      - name: Check ECR repos exist
        id: ecr-check
        run: |
          CORE_API_EXISTS=false
          MOCK_PROVIDER_EXISTS=false

          if aws ecr describe-repositories --repository-names poolmaster-qa/core-api --region ${{ env.AWS_REGION }} > /dev/null 2>&1; then
            CORE_API_EXISTS=true
          fi

          if aws ecr describe-repositories --repository-names poolmaster-qa/mock-contest-feed-provider --region ${{ env.AWS_REGION }} > /dev/null 2>&1; then
            MOCK_PROVIDER_EXISTS=true
          fi

          echo "core_api_exists=${CORE_API_EXISTS}" >> $GITHUB_OUTPUT
          echo "mock_provider_exists=${MOCK_PROVIDER_EXISTS}" >> $GITHUB_OUTPUT

      - name: Validate QA ECS infrastructure contract
        if: steps.ecr-check.outputs.core_api_exists == 'true' || steps.ecr-check.outputs.mock_provider_exists == 'true'
        run: |
          CLUSTER="poolmaster-qa-cluster"
          CORE_SERVICE="poolmaster-qa-core-api"
          MOCK_PROVIDER_SERVICE="poolmaster-qa-mock-contest-feed-provider"

          if ! aws ecs describe-clusters --clusters "$CLUSTER" --query 'clusters[0].status' --output text 2>/dev/null | grep -q ACTIVE; then
            echo "::error::QA cluster ${CLUSTER} is missing. Run terraform apply for QA before deploying."
            exit 1
          fi

          if ! aws ecs describe-services --cluster "$CLUSTER" --services "$CORE_SERVICE" --query 'services[0].status' --output text 2>/dev/null | grep -q ACTIVE; then
            echo "::error::QA core-api service ${CORE_SERVICE} is missing. Run terraform apply for QA before deploying."
            exit 1
          fi

          if ! aws ecs describe-services --cluster "$CLUSTER" --services "$MOCK_PROVIDER_SERVICE" --query 'services[0].status' --output text 2>/dev/null | grep -q ACTIVE; then
            echo "::error::QA mock provider service ${MOCK_PROVIDER_SERVICE} is missing. Run terraform apply for QA before deploying."
            exit 1
          fi

          CORE_SERVICE_TASK_DEF=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$CORE_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          aws ecs describe-task-definition \
            --task-definition "$CORE_SERVICE_TASK_DEF" \
            --query 'taskDefinition.containerDefinitions[0].environment' \
            --output json > /tmp/qa-core-api-env.json

          jq -e '
            any(.[]; .name == "SPORT_DATA_DEFAULT_PROVIDER" and .value == "mock-contest-feed")
            and any(.[]; .name == "SPORT_DATA_PROVIDER_BINDINGS_JSON" and (.value | contains("mock-contest-feed-provider")))
          ' /tmp/qa-core-api-env.json > /dev/null || {
            echo "::error::QA core-api task definition is missing the required mock provider environment contract. Re-run terraform apply for QA before deploying."
            cat /tmp/qa-core-api-env.json
            exit 1
          }

      - name: Build & push core-api
        id: build-core-api
        if: steps.ecr-check.outputs.core_api_exists == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infrastructure/docker/Dockerfile.core-api
          push: true
          tags: |
            ${{ steps.tags.outputs.prefix }}/core-api:${{ steps.tags.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push mock contest feed provider
        id: build-mock-provider
        if: steps.ecr-check.outputs.mock_provider_exists == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infrastructure/docker/Dockerfile.mock-contest-feed-provider
          push: true
          tags: |
            ${{ steps.tags.outputs.prefix }}/mock-contest-feed-provider:${{ steps.tags.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Capture immutable image reference
        id: image-ref
        if: steps.ecr-check.outputs.core_api_exists == 'true' || steps.ecr-check.outputs.mock_provider_exists == 'true'
        run: |
          if [ "${{ steps.ecr-check.outputs.core_api_exists }}" = "true" ]; then
            CORE_API_IMAGE="${{ steps.tags.outputs.prefix }}/core-api@${{ steps.build-core-api.outputs.digest }}"
            echo "core_api_image=${CORE_API_IMAGE}" >> $GITHUB_OUTPUT
            echo "Using immutable core-api image: ${CORE_API_IMAGE}"
          fi

          if [ "${{ steps.ecr-check.outputs.mock_provider_exists }}" = "true" ]; then
            MOCK_PROVIDER_IMAGE="${{ steps.tags.outputs.prefix }}/mock-contest-feed-provider@${{ steps.build-mock-provider.outputs.digest }}"
            echo "mock_provider_image=${MOCK_PROVIDER_IMAGE}" >> $GITHUB_OUTPUT
            echo "Using immutable mock provider image: ${MOCK_PROVIDER_IMAGE}"
          fi

      - name: Register QA ECS task definitions
        id: register-qa-task-defs
        if: steps.ecr-check.outputs.core_api_exists == 'true' || steps.ecr-check.outputs.mock_provider_exists == 'true'
        run: |
          CORE_API_IMAGE="${{ steps.image-ref.outputs.core_api_image }}"
          MOCK_PROVIDER_IMAGE="${{ steps.image-ref.outputs.mock_provider_image }}"
          CLUSTER="poolmaster-qa-cluster"
          CORE_SERVICE="poolmaster-qa-core-api"
          MOCK_PROVIDER_SERVICE="poolmaster-qa-mock-contest-feed-provider"
          MIGRATE_FAMILY="poolmaster-qa-migrate"
          CORE_API_LOG_LEVEL="debug"
          MOCK_PROVIDER_LOG_LEVEL="debug"
          SERVICE_BUILD_NUMBER="${{ github.run_number }}"
          SERVICE_BUILD_TIME_UTC="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          SERVICE_GIT_REF="${GITHUB_REF_NAME}"
          SERVICE_GIT_SHA="${{ steps.tags.outputs.full_sha }}"
          SERVICE_VERSION="${{ steps.tags.outputs.full_sha }}"
          # core/config.ts readAppEnv() requires this and throws when unset, so the
          # service will not start without it. "qa" matches the value the webapp
          # build already uses and the Terraform var.environment for this cluster.
          SERVICE_ENVIRONMENT="qa"
          QA_CORE_API_TASK_DEF=""
          QA_MIGRATE_TASK_DEF=""
          QA_MOCK_PROVIDER_TASK_DEF=""

          if [ -n "$CORE_API_IMAGE" ] && aws ecs describe-services --cluster "$CLUSTER" --services "$CORE_SERVICE" --query 'services[0].status' --output text 2>/dev/null | grep -q ACTIVE; then
            CORE_SERVICE_TASK_DEF=$(aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$CORE_SERVICE" \
              --query 'services[0].taskDefinition' \
              --output text)

            aws ecs describe-task-definition \
              --task-definition "$CORE_SERVICE_TASK_DEF" \
              --query 'taskDefinition' \
              --output json \
              | jq \
                  --arg IMAGE "$CORE_API_IMAGE" \
                  --arg LOG_LEVEL "$CORE_API_LOG_LEVEL" \
                  --arg BUILD_NUMBER "$SERVICE_BUILD_NUMBER" \
                  --arg BUILD_TIME_UTC "$SERVICE_BUILD_TIME_UTC" \
                  --arg GIT_REF "$SERVICE_GIT_REF" \
                  --arg SERVICE_GIT_SHA "$SERVICE_GIT_SHA" \
                  --arg SERVICE_VERSION "$SERVICE_VERSION" \
                  --arg SERVICE_ENVIRONMENT "$SERVICE_ENVIRONMENT" '
                  del(
                    .taskDefinitionArn,
                    .revision,
                    .status,
                    .requiresAttributes,
                    .compatibilities,
                    .registeredAt,
                    .registeredBy
                  )
                  | .containerDefinitions |= map(
                      if .name == "core-api"
                      then
                        .image = $IMAGE
                        | .environment = ((.environment // [])
                          | map(select(.name as $name | [
                            "LOG_LEVEL",
                            "POOLMASTER_BUILD_NUMBER",
                            "POOLMASTER_BUILD_TIME_UTC",
                            "POOLMASTER_GIT_REF",
                            "POOLMASTER_SERVICE_GIT_SHA",
                            "POOLMASTER_SERVICE_VERSION",
                            "POOLMASTER_ENVIRONMENT"
                          ] | index($name) | not))
                          + [
                            { name: "LOG_LEVEL", value: $LOG_LEVEL },
                            { name: "POOLMASTER_BUILD_NUMBER", value: $BUILD_NUMBER },
                            { name: "POOLMASTER_BUILD_TIME_UTC", value: $BUILD_TIME_UTC },
                            { name: "POOLMASTER_GIT_REF", value: $GIT_REF },
                            { name: "POOLMASTER_SERVICE_GIT_SHA", value: $SERVICE_GIT_SHA },
                            { name: "POOLMASTER_SERVICE_VERSION", value: $SERVICE_VERSION },
                            { name: "POOLMASTER_ENVIRONMENT", value: $SERVICE_ENVIRONMENT }
                          ])
                      else . end
                    )
                ' > /tmp/qa-core-api-task-def.json

            QA_CORE_API_TASK_DEF=$(aws ecs register-task-definition \
              --cli-input-json file:///tmp/qa-core-api-task-def.json \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text)

            aws ecs describe-task-definition \
              --task-definition "$MIGRATE_FAMILY" \
              --query 'taskDefinition' \
              --output json \
              | jq --arg IMAGE "$CORE_API_IMAGE" '
                  del(
                    .taskDefinitionArn,
                    .revision,
                    .status,
                    .requiresAttributes,
                    .compatibilities,
                    .registeredAt,
                    .registeredBy
                  )
                  | .containerDefinitions |= map(
                      if .name == "migrate"
                      then .image = $IMAGE | .command = ["node", "scripts/run-migrations.mjs"]
                      else . end
                    )
                ' > /tmp/qa-migrate-task-def.json

            QA_MIGRATE_TASK_DEF=$(aws ecs register-task-definition \
              --cli-input-json file:///tmp/qa-migrate-task-def.json \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text)
          fi

          if [ -n "$MOCK_PROVIDER_IMAGE" ] && aws ecs describe-services --cluster "$CLUSTER" --services "$MOCK_PROVIDER_SERVICE" --query 'services[0].status' --output text 2>/dev/null | grep -q ACTIVE; then
            MOCK_PROVIDER_SERVICE_TASK_DEF=$(aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$MOCK_PROVIDER_SERVICE" \
              --query 'services[0].taskDefinition' \
              --output text)

            aws ecs describe-task-definition \
              --task-definition "$MOCK_PROVIDER_SERVICE_TASK_DEF" \
              --query 'taskDefinition' \
              --output json \
              | jq --arg IMAGE "$MOCK_PROVIDER_IMAGE" --arg LOG_LEVEL "$MOCK_PROVIDER_LOG_LEVEL" '
                  del(
                    .taskDefinitionArn,
                    .revision,
                    .status,
                    .requiresAttributes,
                    .compatibilities,
                    .registeredAt,
                    .registeredBy
                  )
                  | .containerDefinitions |= map(
                      if .name == "mock-contest-feed-provider"
                      then
                        .image = $IMAGE
                        | .environment = ((.environment // [])
                          | map(select(.name != "LOG_LEVEL"))
                          + [{ name: "LOG_LEVEL", value: $LOG_LEVEL }])
                      else . end
                    )
                ' > /tmp/qa-mock-provider-task-def.json

            QA_MOCK_PROVIDER_TASK_DEF=$(aws ecs register-task-definition \
              --cli-input-json file:///tmp/qa-mock-provider-task-def.json \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text)
          fi

          # #281 — job outputs carry family:revision, never the ARN. The ARN embeds the AWS
          # account id, which configure-aws-credentials masks, and Actions silently drops any
          # job output containing a masked value ("Skip output ... since it may contain
          # secret"). That dropped output is why deploy-qa deployed nothing from 2026-09-28.
          # family:revision has no account id and is accepted by run-task and update-service.
          QA_CORE_API_TASK_DEF="${QA_CORE_API_TASK_DEF##*/}"
          QA_MIGRATE_TASK_DEF="${QA_MIGRATE_TASK_DEF##*/}"
          QA_MOCK_PROVIDER_TASK_DEF="${QA_MOCK_PROVIDER_TASK_DEF##*/}"
          for VALUE in "$QA_CORE_API_TASK_DEF" "$QA_MIGRATE_TASK_DEF" "$QA_MOCK_PROVIDER_TASK_DEF"; do
            if [ -n "$VALUE" ] && ! [[ "$VALUE" =~ ^[A-Za-z0-9_-]+:[0-9]+$ ]]; then
              echo "::error::Registered task definition '${VALUE}' is not in family:revision form"
              exit 1
            fi
          done

          # An image was built, so its task definitions must have registered. An empty value
          # here would otherwise travel on and let a later job skip its deploy.
          MISSING=""
          if [ -n "$CORE_API_IMAGE" ] && [ -z "$QA_CORE_API_TASK_DEF" ]; then MISSING="$MISSING qa_core_api_task_definition"; fi
          if [ -n "$CORE_API_IMAGE" ] && [ -z "$QA_MIGRATE_TASK_DEF" ]; then MISSING="$MISSING qa_migrate_task_definition"; fi
          if [ -n "$MOCK_PROVIDER_IMAGE" ] && [ -z "$QA_MOCK_PROVIDER_TASK_DEF" ]; then MISSING="$MISSING qa_mock_contest_feed_provider_task_definition"; fi
          if [ -n "$MISSING" ]; then
            echo "::error::An image was pushed but no task definition was registered for:${MISSING}"
            exit 1
          fi

          echo "qa_core_api_task_definition=${QA_CORE_API_TASK_DEF}" >> $GITHUB_OUTPUT
          echo "qa_migrate_task_definition=${QA_MIGRATE_TASK_DEF}" >> $GITHUB_OUTPUT
          echo "qa_mock_contest_feed_provider_task_definition=${QA_MOCK_PROVIDER_TASK_DEF}" >> $GITHUB_OUTPUT

          if [ -n "${QA_CORE_API_TASK_DEF}" ]; then
            echo "Registered QA core-api task definition: ${QA_CORE_API_TASK_DEF}"
          fi
          if [ -n "${QA_MIGRATE_TASK_DEF}" ]; then
            echo "Registered QA migrate task definition: ${QA_MIGRATE_TASK_DEF}"
          fi
          if [ -n "${QA_MOCK_PROVIDER_TASK_DEF}" ]; then
            echo "Registered QA mock provider task definition: ${QA_MOCK_PROVIDER_TASK_DEF}"
          fi

      - name: No ECR notice
        if: steps.ecr-check.outputs.core_api_exists != 'true' && steps.ecr-check.outputs.mock_provider_exists != 'true'
        run: |
          echo "### ECR repos not found — image push skipped" >> $GITHUB_STEP_SUMMARY
          echo "Run \`terraform apply -var-file=envs/qa.tfvars\` to create QA infrastructure first." >> $GITHUB_STEP_SUMMARY

      - name: Summary
        if: steps.ecr-check.outputs.core_api_exists == 'true' || steps.ecr-check.outputs.mock_provider_exists == 'true'
        run: |
          echo "### Docker Images Published to ECR + QA Task Definitions Registered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tags |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.ecr-check.outputs.core_api_exists }}" = "true" ]; then
            echo "| core-api tag | \`${{ steps.tags.outputs.sha_tag }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| core-api immutable image | \`${{ steps.image-ref.outputs.core_api_image }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| QA core-api task definition | \`${{ steps.register-qa-task-defs.outputs.qa_core_api_task_definition }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| QA migrate task definition | \`${{ steps.register-qa-task-defs.outputs.qa_migrate_task_definition }}\` |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.ecr-check.outputs.mock_provider_exists }}" = "true" ]; then
            echo "| mock contest feed tag | \`${{ steps.tags.outputs.sha_tag }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| mock contest feed immutable image | \`${{ steps.image-ref.outputs.mock_provider_image }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| QA mock provider task definition | \`${{ steps.register-qa-task-defs.outputs.qa_mock_contest_feed_provider_task_definition }}\` |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Nothing is deployed yet: \`deploy-qa\` rolls these out only after \`deploy-migrate-qa\` succeeds." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The mock contest feed provider is deployed in QA only and is intentionally not promoted to staging or prod." >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # QA database migrations. Runs before anything is rolled out (see above).
  # =========================================================================
  deploy-migrate-qa:
    name: deploy-migrate-qa
    runs-on: ubuntu-latest
    needs: deploy-publish-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run ECS migration task
        id: run-migration
        run: |
          SUBNETS="${{ secrets.QA_PRIVATE_SUBNETS }}"
          SG="${{ secrets.QA_ECS_SECURITY_GROUP }}"
          MIGRATE_TASK_DEFINITION="${{ needs.deploy-publish-images.outputs.qa_migrate_task_definition }}"

          # #281 — every exit here used to be a warning and exit 0, which let deploy-qa roll
          # out against an unmigrated schema. On a main push each is now a failure that names
          # what was missing.
          if [ -z "$SUBNETS" ] || [ -z "$SG" ]; then
            echo "::error::QA_PRIVATE_SUBNETS or QA_ECS_SECURITY_GROUP secret is not set; cannot run QA migrations"
            exit 1
          fi

          # The revision this run registered, passed as family:revision. No fallback to the
          # family's latest revision: that would migrate with whatever is newest, possibly a
          # concurrent run's image, rather than the image this run built.
          if [ -z "$MIGRATE_TASK_DEFINITION" ]; then
            echo "::error::deploy-publish-images.outputs.qa_migrate_task_definition is empty; cannot run QA migrations"
            exit 1
          fi
          if ! aws ecs describe-task-definition \
            --task-definition "$MIGRATE_TASK_DEFINITION" \
            --query 'taskDefinition.status' \
            --output text | grep -qx ACTIVE; then
            echo "::error::QA migrate task definition ${MIGRATE_TASK_DEFINITION} does not resolve to an ACTIVE revision"
            exit 1
          fi

          echo "Resolved QA migrate task definition: $MIGRATE_TASK_DEFINITION"
          echo "Starting migration task in ECS..."
          TASK_ARN=$(aws ecs run-task \
            --cluster poolmaster-qa-cluster \
            --task-definition "$MIGRATE_TASK_DEFINITION" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SG}],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' \
            --output text)

          if [ "$TASK_ARN" = "None" ] || [ -z "$TASK_ARN" ]; then
            echo "::error::ECS did not start the QA migration task for ${MIGRATE_TASK_DEFINITION}"
            exit 1
          fi

          echo "task_arn=${TASK_ARN}" >> $GITHUB_OUTPUT
          echo "Migration task started: ${TASK_ARN}"

      # Prints the migrate container's CloudWatch logs whether it passed or
      # failed, so what a migration or repair did is always in the job log.
      - name: Wait for migration to complete
        run: |
          node scripts/ecs-task-wait-and-print-logs.mjs \
            --cluster poolmaster-qa-cluster \
            --task-arn "${{ steps.run-migration.outputs.task_arn }}" \
            --container migrate \
            --timeout-seconds 600

  # =========================================================================
  # Roll the published release out to QA. Only reached once migrations pass.
  # =========================================================================
  deploy-qa:
    name: deploy-qa
    runs-on: ubuntu-latest
    needs: [deploy-publish-images, deploy-migrate-qa]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # #281 — this step used to wrap each update-service in `if [ -n "<output>" ]` and skip
      # when the output was empty. Actions had been dropping that output since 2026-09-28,
      # so every run skipped both deploys and exited 0. Now an empty or malformed value, or
      # a missing cluster, fails the job and names what was missing.
      - name: Deploy QA services
        env:
          CORE_API_TASK_DEFINITION: ${{ needs.deploy-publish-images.outputs.qa_core_api_task_definition }}
          MOCK_PROVIDER_TASK_DEFINITION: ${{ needs.deploy-publish-images.outputs.qa_mock_contest_feed_provider_task_definition }}
        run: |
          MISSING=""
          for NAME in CORE_API_TASK_DEFINITION MOCK_PROVIDER_TASK_DEFINITION; do
            VALUE="${!NAME}"
            if ! [[ "$VALUE" =~ ^[A-Za-z0-9_-]+:[0-9]+$ ]]; then
              MISSING="$MISSING ${NAME}='${VALUE}'"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::deploy-publish-images did not hand over a family:revision task definition for:${MISSING}"
            exit 1
          fi

          if ! aws ecs describe-clusters --clusters poolmaster-qa-cluster --query 'clusters[0].status' --output text | grep -qx ACTIVE; then
            echo "::error::QA cluster poolmaster-qa-cluster is not ACTIVE; nothing was deployed"
            exit 1
          fi

          echo "Deploying poolmaster-qa-core-api with task definition ${CORE_API_TASK_DEFINITION}..."
          aws ecs update-service \
            --cluster poolmaster-qa-cluster \
            --service poolmaster-qa-core-api \
            --task-definition "$CORE_API_TASK_DEFINITION" \
            --no-cli-pager

          echo "Deploying poolmaster-qa-mock-contest-feed-provider with task definition ${MOCK_PROVIDER_TASK_DEFINITION}..."
          aws ecs update-service \
            --cluster poolmaster-qa-cluster \
            --service poolmaster-qa-mock-contest-feed-provider \
            --task-definition "$MOCK_PROVIDER_TASK_DEFINITION" \
            --no-cli-pager

      # #281 — the same three values were computed and printed here on every run since
      # 2026-09-28, with 332 sitting next to 359, and nothing compared them. Now they must
      # agree: the service and its PRIMARY deployment both point at what this run registered.
      - name: Assert QA service rollout target
        id: qa-service-target
        env:
          EXPECTED_TASK_DEFINITION: ${{ needs.deploy-publish-images.outputs.qa_core_api_task_definition }}
        run: |
          CLUSTER="poolmaster-qa-cluster"
          SERVICE="poolmaster-qa-core-api"

          TASK_DEFINITION=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          PRIMARY_TASK_SET=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query 'services[0].deployments[?status==`PRIMARY`] | [0].taskDefinition' \
            --output text)

          echo "task_definition=${TASK_DEFINITION}" >> $GITHUB_OUTPUT
          echo "primary_task_definition=${PRIMARY_TASK_SET}" >> $GITHUB_OUTPUT

          # describe-services reports full ARNs; compare on family:revision.
          REPORTED="${TASK_DEFINITION##*/}"
          PRIMARY="${PRIMARY_TASK_SET##*/}"

          echo "### QA ECS Rollout Target" >> $GITHUB_STEP_SUMMARY
          echo "- Service: \`$SERVICE\`" >> $GITHUB_STEP_SUMMARY
          echo "- Expected task definition: \`${EXPECTED_TASK_DEFINITION}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Reported task definition: \`${REPORTED}\`" >> $GITHUB_STEP_SUMMARY
          echo "- PRIMARY deployment task definition: \`${PRIMARY}\`" >> $GITHUB_STEP_SUMMARY

          if [ "$REPORTED" != "$EXPECTED_TASK_DEFINITION" ] || [ "$PRIMARY" != "$EXPECTED_TASK_DEFINITION" ]; then
            echo "::error::${SERVICE} is not on the task definition this run registered: expected ${EXPECTED_TASK_DEFINITION}, service reports ${REPORTED}, PRIMARY deployment is ${PRIMARY}"
            exit 1
          fi
          echo "${SERVICE} service and PRIMARY deployment are on ${EXPECTED_TASK_DEFINITION}"

      - name: Wait for ECS service to stabilize
        id: ecs-stabilize
        run: |
          CLUSTER="poolmaster-qa-cluster"
          SERVICE="poolmaster-qa-core-api"

          # #281 — services-stable returns in about two seconds against a service with
          # desiredCount 0, because a service with no tasks is already stable. That is how
          # this wait passed for three days while nothing ran. It certifies nothing unless
          # at least one task is wanted.
          DESIRED_COUNT=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query 'services[0].desiredCount' \
            --output text)
          if ! [[ "$DESIRED_COUNT" =~ ^[0-9]+$ ]] || [ "$DESIRED_COUNT" -lt 1 ]; then
            echo "::error::${SERVICE} desiredCount is '${DESIRED_COUNT}'; a stability wait on fewer than one task proves nothing. Terraform declares desired_count >= 1, so this is drift."
            exit 1
          fi
          echo "${SERVICE} desiredCount=${DESIRED_COUNT}; waiting for it to stabilize"

          set +e
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "$SERVICE"
          EXIT_CODE=$?
          set -e

          if [ "$EXIT_CODE" = "0" ]; then
            echo "stable=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "stable=false" >> $GITHUB_OUTPUT
          echo "exit_code=${EXIT_CODE}" >> $GITHUB_OUTPUT
          exit 0

      - name: Dump ECS stabilization diagnostics
        if: steps.ecs-stabilize.outputs.stable == 'false'
        run: |
          CLUSTER="poolmaster-qa-cluster"
          SERVICE="poolmaster-qa-core-api"

          echo "--- ECS Service Description ---"
          aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --output json

          echo "--- ECS Deployments ---"
          aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query 'services[0].deployments[*].{status:status,rolloutState:rolloutState,rolloutStateReason:rolloutStateReason,taskDefinition:taskDefinition,desiredCount:desiredCount,pendingCount:pendingCount,runningCount:runningCount,failedTasks:failedTasks,createdAt:createdAt,updatedAt:updatedAt}' \
            --output table

          echo "--- Recent ECS Service Events ---"
          aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query 'services[0].events[:10].[createdAt,message]' \
            --output table

          TASK_DEFINITION="${{ steps.qa-service-target.outputs.task_definition }}"
          if [ -n "$TASK_DEFINITION" ] && [ "$TASK_DEFINITION" != "None" ]; then
            echo "--- ECS Task Definition ---"
            aws ecs describe-task-definition \
              --task-definition "$TASK_DEFINITION" \
              --query 'taskDefinition.{taskDefinitionArn:taskDefinitionArn,containerDefinitions:containerDefinitions[*].{name:name,image:image,healthCheck:healthCheck,logConfiguration:logConfiguration}}' \
              --output json
          fi

          echo "--- Running Tasks ---"
          RUNNING_TASKS=$(aws ecs list-tasks \
            --cluster "$CLUSTER" \
            --service-name "$SERVICE" \
            --desired-status RUNNING \
            --query 'taskArns' \
            --output text)
          if [ -n "$RUNNING_TASKS" ] && [ "$RUNNING_TASKS" != "None" ]; then
            aws ecs describe-tasks \
              --cluster "$CLUSTER" \
              --tasks $RUNNING_TASKS \
              --query 'tasks[*].{taskArn:taskArn,taskDefinitionArn:taskDefinitionArn,lastStatus:lastStatus,desiredStatus:desiredStatus,healthStatus:healthStatus,launchType:launchType,startedAt:startedAt,stopCode:stopCode,stoppedReason:stoppedReason,containers:containers[*].{name:name,lastStatus:lastStatus,healthStatus:healthStatus,exitCode:exitCode,reason:reason,image:image,networkBindings:networkBindings,networkInterfaces:networkInterfaces}}' \
              --output json
          else
            echo "(no running tasks)"
          fi

          echo "--- Recently Stopped Tasks ---"
          STOPPED_TASKS=$(aws ecs list-tasks \
            --cluster "$CLUSTER" \
            --service-name "$SERVICE" \
            --desired-status STOPPED \
            --query 'taskArns[:10]' \
            --output text)
          if [ -n "$STOPPED_TASKS" ] && [ "$STOPPED_TASKS" != "None" ]; then
            aws ecs describe-tasks \
              --cluster "$CLUSTER" \
              --tasks $STOPPED_TASKS \
              --query 'tasks[*].{taskArn:taskArn,taskDefinitionArn:taskDefinitionArn,lastStatus:lastStatus,desiredStatus:desiredStatus,healthStatus:healthStatus,launchType:launchType,startedAt:startedAt,stoppedAt:stoppedAt,stopCode:stopCode,stoppedReason:stoppedReason,containers:containers[*].{name:name,lastStatus:lastStatus,healthStatus:healthStatus,exitCode:exitCode,reason:reason,image:image,networkBindings:networkBindings,networkInterfaces:networkInterfaces}}' \
              --output json

            TASK_ID=$(echo "$STOPPED_TASKS" | awk '{print $1}' | awk -F'/' '{print $NF}')
            if [ -n "$TASK_ID" ] && [ "$TASK_ID" != "None" ] && [ -n "$TASK_DEFINITION" ] && [ "$TASK_DEFINITION" != "None" ]; then
              LOG_GROUP=$(aws ecs describe-task-definition \
                --task-definition "$TASK_DEFINITION" \
                --query 'taskDefinition.containerDefinitions[?name==`core-api`] | [0].logConfiguration.options."awslogs-group"' \
                --output text 2>/dev/null || echo "")
              LOG_PREFIX=$(aws ecs describe-task-definition \
                --task-definition "$TASK_DEFINITION" \
                --query 'taskDefinition.containerDefinitions[?name==`core-api`] | [0].logConfiguration.options."awslogs-stream-prefix"' \
                --output text 2>/dev/null || echo "")

              if [ -n "$LOG_GROUP" ] && [ "$LOG_GROUP" != "None" ] && [ -n "$LOG_PREFIX" ] && [ "$LOG_PREFIX" != "None" ]; then
                echo "--- Recent CloudWatch Log Streams (${LOG_GROUP}) ---"
                aws logs describe-log-streams \
                  --log-group-name "$LOG_GROUP" \
                  --order-by LastEventTime \
                  --descending \
                  --max-items 10 \
                  --query 'logStreams[*].{logStreamName:logStreamName,lastEventTimestamp:lastEventTimestamp,lastIngestionTime:lastIngestionTime}' \
                  --output table 2>/dev/null || echo "(no recent log streams available)"

                echo "--- Latest Stopped Task Logs (${TASK_ID}) ---"
                LOG_STREAM=$(aws logs describe-log-streams \
                  --log-group-name "$LOG_GROUP" \
                  --log-stream-name-prefix "${LOG_PREFIX}/core-api/${TASK_ID}" \
                  --order-by LastEventTime \
                  --descending \
                  --max-items 1 \
                  --query 'logStreams[0].logStreamName' \
                  --output text 2>/dev/null || echo "")

                if [ -n "$LOG_STREAM" ] && [ "$LOG_STREAM" != "None" ]; then
                  aws logs get-log-events \
                    --log-group-name "$LOG_GROUP" \
                    --log-stream-name "$LOG_STREAM" \
                    --query 'events[].message' \
                    --output text 2>/dev/null || echo "(no task logs available)"
                else
                  echo "(no task log stream found for ${TASK_ID})"
                fi
              fi
            fi
          else
            echo "(no stopped tasks)"
          fi

          TARGET_GROUP_ARN=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query 'services[0].loadBalancers[0].targetGroupArn' \
            --output text 2>/dev/null || echo "")
          if [ -n "$TARGET_GROUP_ARN" ] && [ "$TARGET_GROUP_ARN" != "None" ]; then
            echo "--- ALB Target Health ---"
            aws elbv2 describe-target-health \
              --target-group-arn "$TARGET_GROUP_ARN" \
              --query 'TargetHealthDescriptions[*].{targetId:Target.Id,targetPort:Target.Port,state:TargetHealth.State,reason:TargetHealth.Reason,description:TargetHealth.Description}' \
              --output table 2>/dev/null || echo "(no target health data available)"
          fi

          echo "### ECS Stabilization Failure" >> $GITHUB_STEP_SUMMARY
          echo "- Service: \`$SERVICE\`" >> $GITHUB_STEP_SUMMARY
          echo "- Waiter exit code: \`${{ steps.ecs-stabilize.outputs.exit_code }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Reported task definition: \`${{ steps.qa-service-target.outputs.task_definition }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- PRIMARY task definition: \`${{ steps.qa-service-target.outputs.primary_task_definition }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Recent ECS service events and latest stopped-task logs were dumped to the job output." >> $GITHUB_STEP_SUMMARY

      - name: Fail on ECS stabilization error
        if: steps.ecs-stabilize.outputs.stable == 'false'
        run: |
          echo "QA ECS service failed to stabilize after deployment."
          exit 1

      # #281 — with the deployment circuit breaker's rollback enabled, a deployment that
      # cannot reach steady state is rolled back to the previous revision, and the service
      # is then stable again: services-stable succeeds on the old code. So "stable" is not
      # "deployed". Re-assert after the wait that the rollout completed on this run's revision.
      - name: Assert QA rollout completed on this run's task definition
        env:
          EXPECTED_TASK_DEFINITION: ${{ needs.deploy-publish-images.outputs.qa_core_api_task_definition }}
        run: |
          CLUSTER="poolmaster-qa-cluster"
          SERVICE="poolmaster-qa-core-api"

          # #287 — poll for a terminal rolloutState rather than sampling it once.
          #
          # services-stable does not wait on rolloutState. Its success condition is
          # `length(deployments) == 1 && runningCount == desiredCount`, which is true as soon as
          # the old deployment has drained and the new task is RUNNING. ECS marks the deployment
          # COMPLETED later, once it is satisfied the rollout succeeded, which includes ALB
          # target-group health -- and #281's own health_check_grace_period_seconds = 120 delays
          # exactly that. QA runs desired_count = 1, so there is no second task to cover the gap.
          # Sampling once inside that window failed run 1142 on a deploy that had placed the
          # right revision: "service is on :362 ... rolloutState is IN_PROGRESS".
          #
          # FAILED is still a hard stop on the first read -- that is the circuit-breaker rollback
          # this step exists to catch, and there is no point waiting out a deployment ECS has
          # already given up on.
          DEADLINE=$((SECONDS + 300))
          while :; do
            REPORTED=$(aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$SERVICE" \
              --query 'services[0].taskDefinition' \
              --output text)
            REPORTED="${REPORTED##*/}"
            ROLLOUT_STATE=$(aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$SERVICE" \
              --query 'services[0].deployments[?status==`PRIMARY`] | [0].rolloutState' \
              --output text)

            if [ "$ROLLOUT_STATE" = "FAILED" ] || [ "$ROLLOUT_STATE" = "COMPLETED" ]; then
              break
            fi
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::${SERVICE} rollout of ${EXPECTED_TASK_DEFINITION} did not reach a terminal state within 300s: service is on ${REPORTED}, PRIMARY rolloutState is ${ROLLOUT_STATE}."
              exit 1
            fi
            echo "PRIMARY rolloutState is ${ROLLOUT_STATE}; waiting for a terminal state."
            sleep 10
          done

          echo "- After the wait: service on \`${REPORTED}\`, PRIMARY rolloutState \`${ROLLOUT_STATE}\`" >> "$GITHUB_STEP_SUMMARY"

          if [ "$REPORTED" != "$EXPECTED_TASK_DEFINITION" ] || [ "$ROLLOUT_STATE" != "COMPLETED" ]; then
            echo "::error::${SERVICE} did not complete a rollout of ${EXPECTED_TASK_DEFINITION}: service is on ${REPORTED}, PRIMARY rolloutState is ${ROLLOUT_STATE}. A circuit-breaker rollback ends here."
            exit 1
          fi
          echo "${SERVICE} rollout of ${EXPECTED_TASK_DEFINITION} completed"

      # The webapp goes out after the API it calls is stable.
      - name: Build PoolMaster webapp
        run: |
          npm ci
          npx prisma generate --schema=packages/core-api/prisma/schema.prisma
          WEB_RELEASE_PREFIX="releases/${{ github.sha }}"
          cd clients/poolmaster
          APP_ASSET_BASE="/${WEB_RELEASE_PREFIX}/" \
          POOLMASTER_ENVIRONMENT="qa" \
          VITE_LOG_LEVEL="debug" \
          POOLMASTER_RELEASE_PREFIX="${WEB_RELEASE_PREFIX}" \
          POOLMASTER_BUILD_TIME_UTC="$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
          POOLMASTER_BUILD_NUMBER="${{ github.run_number }}" \
          POOLMASTER_GIT_REF="${GITHUB_REF_NAME}" \
          POOLMASTER_WEBAPP_GIT_SHA="${{ github.sha }}" \
          POOLMASTER_SERVICE_VERSION="${{ github.sha }}" \
          POOLMASTER_SERVICE_GIT_SHA="${{ github.sha }}" \
          npm run build
          grep -q "/${WEB_RELEASE_PREFIX}/" dist/index.html
          test -f dist/version-info.json

      - name: Deploy PoolMaster webapp to S3 + invalidate CloudFront
        id: deploy-webapp
        run: |
          BUCKET="poolmaster-qa-webapp"
          RELEASE_PREFIX="releases/${{ github.sha }}"
          CF_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Comment=='poolmaster-qa webapp'].Id" --output text 2>/dev/null)
          if aws s3 ls "s3://${BUCKET}" 2>/dev/null; then
            aws s3 sync clients/poolmaster/dist/ "s3://${BUCKET}/${RELEASE_PREFIX}/" --delete
            aws s3 cp clients/poolmaster/dist/index.html "s3://${BUCKET}/index.html" --cache-control "no-store, no-cache, max-age=0, must-revalidate" --content-type "text/html"
            aws s3api head-object --bucket "${BUCKET}" --key "${RELEASE_PREFIX}/index.html" >/dev/null
            aws s3api head-object --bucket "${BUCKET}" --key "index.html" >/dev/null
            if [ -n "$CF_ID" ]; then
              aws cloudfront create-invalidation --distribution-id "$CF_ID" --paths "/*" --no-cli-pager
            fi
            echo "release_prefix=${RELEASE_PREFIX}" >> $GITHUB_OUTPUT
            echo "PoolMaster webapp deployed to S3 release ${RELEASE_PREFIX} and root index updated"
          else
            echo "::error::S3 bucket ${BUCKET} not found — run terraform apply first"
            exit 1
          fi

      - name: Warm-up delay after ECS stabilization
        if: steps.ecs-stabilize.outputs.stable == 'true'
        run: sleep 20

  poolmaster-browser-e2e:
    name: poolmaster-browser-e2e
    runs-on: ubuntu-latest
    # Checks the release deploy-qa rolled out. Since #191 a failed migration
    # stops the rollout, so there is nothing new to check and this is skipped;
    # deploy-health-issue is what reports that failure.
    needs: deploy-qa
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      POOLMASTER_E2E_BASE_URL: https://qa.ultimateofficepoolmanager.com
      POOLMASTER_E2E_ADMIN_IDENTIFIER: ${{ secrets.POOLMASTER_E2E_ADMIN_IDENTIFIER }}
      POOLMASTER_E2E_ADMIN_PASSWORD: ${{ secrets.POOLMASTER_E2E_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - name: Verify deployed PoolMaster frontend release
        run: |
          EXPECTED_RELEASE="releases/${{ github.sha }}"

          for ATTEMPT in $(seq 1 24); do
            HTML=$(curl -fsSL "$POOLMASTER_E2E_BASE_URL/" || true)

            if printf '%s' "$HTML" | grep -q "$EXPECTED_RELEASE"; then
              echo "Verified deployed PoolMaster frontend release: $EXPECTED_RELEASE"
              exit 0
            fi

            echo "Attempt $ATTEMPT: deployed frontend release did not yet match $EXPECTED_RELEASE"
            sleep 5
          done

          echo "Expected deployed PoolMaster frontend release $EXPECTED_RELEASE was not observed."
          exit 1
      - run: npm ci
      - name: Install Playwright Chromium
        run: cd clients/poolmaster && npx playwright install --with-deps chromium
      # Only the @smoke specs: the deployed environment gets nothing that
      # writes domain data. Traces stay on; the config's globalTeardown
      # (e2e/redact-artifacts.ts) scrubs credentials and session tokens from
      # them before the report is built and this job uploads it.
      - name: Run PoolMaster browser E2E smoke
        run: npm run test:poolmaster:browser-e2e:smoke
      - name: Upload PoolMaster browser E2E artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: poolmaster-browser-e2e
          path: |
            clients/poolmaster/playwright-report/**
            clients/poolmaster/test-results/**
          if-no-files-found: warn
      - name: PoolMaster browser E2E summary
        if: always()
        run: |
          echo "### PoolMaster Browser E2E" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Base URL: \`$POOLMASTER_E2E_BASE_URL\`" >> $GITHUB_STEP_SUMMARY
          echo "- Expected release prefix: \`releases/${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Specs: \`@smoke\` only — deploy-reachability ping, and root admin signs in, reaches /manage, logs out (#278). Creates no domain data." >> $GITHUB_STEP_SUMMARY

  # Ten failed QA deploys in a row went unnoticed (#191) because a red
  # deploy job on main surfaces nowhere. Keep one open issue while the deploy
  # is failing — opened on the first failure, commented on each repeat —
  # and close it on the next fully green deploy.
  deploy-health-issue:
    name: deploy-health-issue
    runs-on: ubuntu-latest
    needs: [deploy-publish-images, deploy-migrate-qa, deploy-qa]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      issues: write
    steps:
      - name: Open, update, or close the QA deploy failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PUBLISH_RESULT: ${{ needs.deploy-publish-images.result }}
          MIGRATE_RESULT: ${{ needs.deploy-migrate-qa.result }}
          DEPLOY_RESULT: ${{ needs.deploy-qa.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          TITLE="QA deploy is failing on main"
          ISSUE=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)
          RESULTS="publish-images: \`$PUBLISH_RESULT\`, migrate-qa: \`$MIGRATE_RESULT\`, deploy-qa: \`$DEPLOY_RESULT\`"

          if [ "$PUBLISH_RESULT" = "failure" ] || [ "$MIGRATE_RESULT" = "failure" ] || [ "$DEPLOY_RESULT" = "failure" ]; then
            BODY="The QA deploy failed for \`$SHA\` — $RESULTS. Run: $RUN_URL"
            if [ -n "$ISSUE" ]; then
              gh issue comment "$ISSUE" --body "$BODY"
            else
              gh issue create --title "$TITLE" --body "$BODY

          This issue is managed by the \`deploy-health-issue\` CI job: it is commented on for every further failed deploy and closed automatically by the next successful one."
            fi
            echo "::error::QA deploy failed — $RESULTS"
          elif [ "$PUBLISH_RESULT" = "success" ] && [ "$MIGRATE_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ] && [ -n "$ISSUE" ]; then
            gh issue close "$ISSUE" --comment "QA deployed successfully at \`$SHA\`. Run: $RUN_URL"
          else
            echo "Nothing to report — $RESULTS"
          fi
