# Fetch public source pages for the load-sport-data skill and commit their text to the branch
# the workflow runs on, under sport-sources/. Cloud agent sessions cannot reach tour and
# reference sites; GitHub Actions can, so the skill reads and cross-checks the pages from the
# branch, then deletes the folder before its data file is merged.
#
# workflow_dispatch only, never on main: it pushes a commit to the branch it runs on.
# See scripts/fetch-sport-sources.mjs.
name: Fetch sport sources

on:
  workflow_dispatch:
    inputs:
      urls:
        description: https URLs to fetch, separated by spaces or newlines (at most 20)
        type: string
        required: true

concurrency:
  group: fetch-sport-sources-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    name: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref_name != github.event.repository.default_branch
    env:
      # Inputs go through the environment, never into the script text.
      SOURCE_URLS: ${{ inputs.urls }}
      SOURCES_DIR: sport-sources
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Fetch the pages
        shell: bash
        run: |
          rm -rf "$SOURCES_DIR"
          # SOURCE_URLS is split on whitespace by the script, not the shell.
          node scripts/fetch-sport-sources.mjs "$SOURCES_DIR" "$SOURCE_URLS" 2>&1 | tee fetch.log
      - name: Commit the pages to this branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add "$SOURCES_DIR"
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Fetched sport sources for the load-sport-data skill"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Fetched sport sources into ${SOURCES_DIR}/"
            echo ""
            echo '```'
            cat fetch.log 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
