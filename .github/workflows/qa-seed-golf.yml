# Load test data into QA (#1850): the test seeds, rolling "Test-" events made from last season's
# with their made-up odds, tiers, prices and results, or a test slate. Real events and fields
# never come from a file: the provider sync creates them. Rebuilding QA goes reset, then turn on
# each sport league's sync (its events and fields arrive), then this run
# (docs/SPORT-DATA-LOADING.md, "Rebuilding QA").
#
# workflow_dispatch only: test data never rides a migration or a deploy. It goes in through
# QA's public admin API as the E2E root admin, the same way the Manage screens write it, so
# nothing touches the database directly. The file's envelope says what it holds and what a
# run may change (packages/core-api/scripts/seed-golf/sport-data-file.ts). A test player
# carrying a provider's feed id is matched to, or bound to, the participant the sync uses.
#
# Dry run is the default: it reads QA and lists what applying would add, update, skip or
# leave as a conflict, and writes nothing. Apply compares and fills in, so running the same
# file again reports everything as a skip. The loader reads the site's environment first and
# refuses anything but a test target.
#
# A test slate (test-slates/<sport league>.json) fills the field of one event already on the
# site, named in `event`, for trying contests before the real field is out. With
# `replace_field` it removes every field row the slate does not list rather than withdrawing
# it; a row a contest entry has picked is withdrawn instead.
# `all_test_data` loads every test seed in the folder in one run, in place of `file`.
# `with_participants` also loads test players, a league per sport league, contests on its next
# events and a submitted entry from each player. Like every load, both are safe to run again.
# See docs/SPORT-DATA-LOADING.md.
name: Load test data

on:
  workflow_dispatch:
    inputs:
      file:
        description: Data file, a path inside packages/core-api/scripts/seed-golf/
        type: string
        default: golf-2026.json
      mode:
        description: dry-run reports what would change; apply writes it
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run
      event:
        description: Test slate only, the name of the event whose field it fills
        type: string
        default: ''
      replace_field:
        description: Test slate only, replace the participant field instead of filling it in
        type: boolean
        default: false
      all_test_data:
        description: Load every test seed (not the test slates); file is ignored
        type: boolean
        default: false
      with_participants:
        description: Also load test players, leagues, contests and entries (QA only)
        type: boolean
        default: false
      events_per_league:
        description: Test seeds only, how many "Test-" events each sport league gets per run
        type: string
        default: '2'

# It only reads the checkout; QA is written through the API with the admin secrets.
permissions:
  contents: read

concurrency:
  group: qa-seed-golf
  cancel-in-progress: false

jobs:
  load:
    name: load
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      POOLMASTER_SEED_BASE_URL: https://qa.ultimateofficepoolmanager.com
      POOLMASTER_SEED_ADMIN_IDENTIFIER: ${{ secrets.POOLMASTER_E2E_ADMIN_IDENTIFIER }}
      POOLMASTER_SEED_ADMIN_PASSWORD: ${{ secrets.POOLMASTER_E2E_ADMIN_PASSWORD }}
      # Inputs go through the environment, never into the script text.
      LOAD_FILE: ${{ inputs.file }}
      LOAD_MODE: ${{ inputs.mode }}
      LOAD_EVENT: ${{ inputs.event }}
      LOAD_REPLACE_FIELD: ${{ inputs.replace_field }}
      LOAD_ALL_TEST_DATA: ${{ inputs.all_test_data }}
      LOAD_WITH_PARTICIPANTS: ${{ inputs.with_participants }}
      LOAD_EVENTS_PER_LEAGUE: ${{ inputs.events_per_league }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - name: Build the shared package the generated SDK resolves through
        run: npm run build --workspace @poolmaster/shared
      # bash -o pipefail, so a failed load fails the step rather than reporting tee's exit
      # code, and stderr goes to the log the summary falls back to.
      - name: Load into QA
        shell: bash
        run: |
          args=(--mode "$LOAD_MODE" --report load-report.md --events-per-league "$LOAD_EVENTS_PER_LEAGUE")
          if [ "$LOAD_ALL_TEST_DATA" = "true" ]; then
            args+=(--all-test-data)
          else
            args+=(--file "$LOAD_FILE")
            if [ -n "$LOAD_EVENT" ]; then args+=(--event "$LOAD_EVENT"); fi
            if [ "$LOAD_REPLACE_FIELD" = "true" ]; then args+=(--replace-field); fi
          fi
          if [ "$LOAD_WITH_PARTICIPANTS" = "true" ]; then args+=(--with-participants); fi
          npm run seed:golf -- "${args[@]}" 2>&1 | tee load.log
      - name: Summary
        if: always()
        shell: bash
        run: |
          if [ -f load-report.md ]; then
            cat load-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Load test data failed"
              echo ""
              echo '```'
              tail -n 40 load.log 2>/dev/null || echo "(no output)"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
